<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tech Samjho Raj Classroom</title>
<meta name="description" content="Tech Samjho Raj: free lessons on Python, AI chatbots and AI agents, Watch a short video, read the notes, try the code.">
<link rel="icon" href="img/raj-mark.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#202321">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tech Samjho">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: Skool-style community shell — brand bar + tab row, then Classroom grid / course view with lesson sidebar.
   Palette and type carried over from the original techsamjhoraj.com (paper, ink, brick red, forest green, Georgia). */
:root{
  --paper:#f6f3ec; --card:#fbfaf6; --ink:#202321; --muted:#646860; --line:#d8d9d0;
  --accent:#b93628; --green:#244c41; --green-soft:#e0e8df; --gold:#ece4cf; --red-soft:#efded6;
  --code-bg:#1d211f; --code-fg:#eef0e8; --code-key:#7fd1b9; --code-str:#e5b36b; --code-com:#8d958c;
  --display:Georgia,"Times New Roman",serif;
  --body:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151816; --card:#1c201d; --ink:#ecebe4; --muted:#a3a89f; --line:#30352f;
  --accent:#e0705f; --green:#8cc5ae; --green-soft:#223029; --gold:#2e2a1f; --red-soft:#33221f;
  --code-bg:#0e100f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151816; --card:#1c201d; --ink:#ecebe4; --muted:#a3a89f; --line:#30352f;
  --accent:#e0705f; --green:#8cc5ae; --green-soft:#223029; --gold:#2e2a1f; --red-soft:#33221f;
  --code-bg:#0e100f; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand span{color:var(--accent)}
.lang{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;text-decoration:none;color:var(--muted);font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

main{padding-block:32px 64px;min-height:70vh}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--muted)}
h1,h2,h3{text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;margin:10px 0 12px}
h1 em{color:var(--accent)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.8px;margin:0 0 8px;line-height:1.15}
h3{font-size:18px;margin:0}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:0}
.hindi{color:var(--green);font-size:16px;margin:6px 0 0}

/* classroom */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.stats{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:28px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.course{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.cover{aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;background:#0e1116}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .pill{position:absolute;left:12px;top:12px;background:rgba(14,17,22,.82);color:#f5f1e8;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;letter-spacing:.5px}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody p{margin:0;color:var(--muted);font-size:14.5px}
.meta{font-size:13px;color:var(--muted);margin-top:auto}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.progrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progrow .prog{flex:1}
.note{font-size:13.5px;color:var(--muted);margin-top:26px}

/* course view */
.course-view{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.course-view{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.module{border-bottom:1px solid var(--line)}
.module:last-child{border-bottom:0}
.module summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.module summary::-webkit-details-marker{display:none}
.module summary .count{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.lessons{list-style:none;margin:0;padding:0 8px 10px}
.lesson-link{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.4}
.lesson-link:hover{background:var(--paper)}
.lesson-link[aria-current="true"]{background:var(--green-soft);font-weight:700}
.lesson-link.locked{color:var(--muted);cursor:default}
.lesson-link.locked:hover{background:transparent}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.tick.done{background:var(--green);border-color:var(--green)}
.tick.done:after{content:"";width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick.lock{border-style:dashed}
.soon{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

.lesson{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-top{display:flex;flex-direction:column;gap:4px}
.player{background:#0e1116;border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.player video{display:block;width:100%;max-width:560px;aspect-ratio:1/1;background:#0e1116}
.player.wide video{max-width:100%;aspect-ratio:16/9}
.placeholder{aspect-ratio:16/9;max-width:100%;width:100%;display:grid;place-items:center;text-align:center;color:#d8d9d0;padding:24px;background:#0e1116}
.placeholder b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:#f5f1e8;margin-bottom:6px}
.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.block h3{font-size:13px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:10px}
.block p{margin:0 0 10px;max-width:68ch}
.block p:last-child{margin-bottom:0}
.block ul{margin:0;padding-left:20px;max-width:68ch}
.block li{margin:4px 0}
.takeaway{background:var(--green);color:var(--paper);border-color:var(--green)}
.takeaway h3{color:var(--paper);opacity:.75}
.takeaway p{font-family:var(--display);font-size:24px;line-height:1.3}
.try{background:var(--gold);border-color:transparent}
code{font-family:var(--mono);font-size:.92em;background:var(--green-soft);padding:1px 5px;border-radius:4px}
.codebox{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:10px;overflow:hidden}
.codebox .file{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font:12.5px var(--mono);color:var(--code-com);border-bottom:1px solid rgba(255,255,255,.08)}
.copy{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--code-fg);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.08)}
.codebox pre{margin:0;padding:16px 18px;overflow-x:auto;font:14.5px/1.65 var(--mono)}
.codebox code{background:none;padding:0;border-radius:0;font-size:inherit;color:inherit}
.k{color:var(--code-key)} .s{color:var(--code-str)} .c{color:var(--code-com)}
.out{border-top:1px dashed rgba(255,255,255,.14)}
.out pre{color:var(--code-str)}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid var(--ink);border-radius:8px;background:transparent;text-decoration:none;cursor:pointer;font-size:14.5px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.done{background:var(--green);border-color:var(--green);color:var(--paper)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.navbtns{display:flex;gap:10px}

/* other tabs */
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.card p{color:var(--muted);margin:8px 0 0;font-size:15px}
.mail{font-family:var(--mono);font-size:15px;user-select:all;background:var(--green-soft);padding:6px 10px;border-radius:6px;display:inline-block;margin-top:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.timeline li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:8px}
@media (max-width:600px){.timeline li{grid-template-columns:1fr}}
.timeline .course-tag{font-size:12px;color:var(--muted)}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--accent);white-space:nowrap;justify-self:start}
.chip.next{background:var(--green-soft);color:var(--green)}
.about{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:700px){.about{grid-template-columns:1fr}}
.about img{width:180px;height:180px;border-radius:50%;border:4px solid var(--card);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.about p{color:var(--muted);font-size:17px;max-width:62ch}
.principles{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.principles span{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--green)}
.social{display:flex;gap:8px;flex-wrap:wrap}
.social a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink);background:var(--card)}
.social a:hover{border-color:var(--ink)}
.social a.ico{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;color:var(--sb,var(--ink))}
.social a.ico svg{width:18px;height:18px;fill:currentColor}
.social a.ico:hover{border-color:currentColor}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.install{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;border:1px solid #202321;border-radius:99px;padding:3px 12px 3px 3px;background:#202321;color:#fff;cursor:pointer;white-space:nowrap;animation:install-pop 5s ease-in-out 1.5s 3}
.install img{width:28px;height:28px;border-radius:50%;display:block;background:#fff;flex:none}
.install::after{content:"";position:absolute;inset:-2px;border-radius:99px;border:2px solid var(--accent);opacity:0;pointer-events:none;animation:install-ring 5s ease-out 1.5s 3}
.install:hover,.install:hover::after{animation-play-state:paused}
@keyframes install-pop{0%,14%,100%{transform:none}5%{transform:scale(1.1)}10%{transform:scale(.98)}}
@keyframes install-ring{0%{opacity:.8;transform:scale(1)}16%{opacity:0;transform:scale(1.4)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.install,.install::after{animation:none}}
/* shown from the first paint so the header never jumps; hidden inside the installed app */
@media (display-mode:standalone){.install{display:none!important}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .install{border-color:rgba(255,255,255,.35)}}
:root[data-theme="dark"] .install{border-color:rgba(255,255,255,.35)}
@media (max-width:420px){.install{padding-right:10px;gap:5px}.install img{width:24px;height:24px}.install-x{display:none}}
.install[hidden]{display:none}
.bar-right{display:flex;gap:10px;align-items:center}
.install-help{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px 22px 18px;max-width:min(420px,calc(100vw - 32px));font-size:15.5px}
.install-help::backdrop{background:rgba(0,0,0,.45)}
.install-help h3{margin:0 0 10px;font-size:19px}
.install-help ol{padding-left:20px;margin:8px 0}
.install-help li{margin:6px 0}
.install-help p{margin:8px 0;color:var(--muted)}
.install-help .btn{margin-top:10px}
@media (max-width:700px){.bar .social{display:none}}
.install-help.ios{margin:16px auto auto}
.ih-ico{width:22px;height:22px;vertical-align:-5px;color:#0a84ff;display:inline-block}
.ih-steps{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:12px}
.ih-steps li{display:flex;gap:10px;align-items:flex-start;margin:0!important}
.ih-n{flex:none;width:26px;height:26px;border-radius:50%;background:#0a84ff;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.ih-lead{color:var(--ink)!important}
.ih-arrow{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#0a84ff;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:ih-bounce 1.2s ease-in-out infinite}
.ih-arrow span{font-size:20px;line-height:1}
@keyframes ih-bounce{0%,100%{translate:0 0}50%{translate:0 8px}}
@media (prefers-reduced-motion:reduce){.ih-arrow{animation:none}}
.install-help.ios-chrome{margin:auto auto 16px}
.ih-arrow.up{bottom:auto;top:max(10px,env(safe-area-inset-top));right:14px;left:auto;transform:none}
.signup{background:var(--green-soft);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px 26px;align-items:center;margin-top:26px}
@media (max-width:760px){.signup{grid-template-columns:1fr}}
.signup h3{margin:0 0 4px;font-size:19px;text-transform:none;letter-spacing:0;color:var(--ink)}
.signup p{margin:0;color:var(--muted);font-size:14.5px}
.signup form{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.signup input{flex:1 1 200px;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.signup input:focus{outline:none;border-color:var(--ink)}
.signup form small{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.signup .ok{color:var(--green);font-weight:700;font-size:15px}
.legal{max-width:760px}
.legal h2{font-size:22px;margin:26px 0 6px}
.legal p,.legal li{color:var(--muted);font-size:15.5px}
.legal ul{padding-left:20px}
.cb-fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:30;display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:99px;border:1px solid #202321;background:#202321;color:#fff;font:700 14px var(--body);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cb-fab span{font-size:20px;line-height:1}
.cb-fab[aria-expanded="true"]{display:none}
.cb-panel{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:31;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 110px));display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.3);overflow:hidden}
.cb-panel[hidden]{display:none}
.cb-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#202321;color:#fff}
.cb-head b{font-size:15px;display:block}
.cb-head small{opacity:.8;font-size:12px}
.cb-head .cb-av{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.cb-x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:4px 6px}
.cb-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.cb-msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.cb-msg.bot{background:var(--green-soft);border-bottom-left-radius:4px;align-self:flex-start}
.cb-msg.me{background:#202321;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.cb-msg a{color:inherit;font-weight:700}
.cb-msg.typing{opacity:.6;font-style:italic}
.cb-chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.cb-chips::-webkit-scrollbar{display:none}
.cb-chips button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.cb-chips button:hover{border-color:var(--ink)}
.cb-form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.cb-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;padding:10px 14px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.cb-form input:focus{outline:none;border-color:var(--ink)}
.cb-form button{border:0;border-radius:99px;background:#202321;color:#fff;font-weight:700;padding:0 16px;cursor:pointer}
.cb-foot{font-size:11.5px;color:var(--muted);padding:0 14px 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cb-fab{border-color:rgba(255,255,255,.35)}}
:root[data-theme="dark"] .cb-fab{border-color:rgba(255,255,255,.35)}
@media (max-width:480px){.cb-panel{right:8px;left:8px;width:auto;bottom:8px;height:min(78vh,600px)}.cb-fab{padding:9px 14px 9px 11px;font-size:13.5px}}
@media print{.cb-fab,.cb-panel{display:none!important}}
.promo{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:26px;text-decoration:none;color:inherit}
.promo:hover{border-color:var(--ink)}
.promo img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:#0e1116}
.promo .pl{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.promo h3{margin:4px 0;font-size:18px;text-transform:none;letter-spacing:0;color:var(--ink)}
.promo p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.promo .go{font-weight:700;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
@media (max-width:600px){.promo{grid-template-columns:1fr}}

// ---------- tiny python highlighter ----------
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(code){
  return code.split("\n").map(line => {
    let out = "", rest = line, m;
    const re = /("[^"]*"|'[^']*'|#.*$)/;
    while ((m = re.exec(rest))) {
      out += kw(esc(rest.slice(0, m.index)));
      out += m[0][0] === "#" ? `<span class="c">${esc(m[0])}</span>` : `<span class="s">${esc(m[0])}</span>`;
      rest = rest.slice(m.index + m[0].length);
    }
    return out + kw(esc(rest));
  }).join("\n");
}
function kw(s){ return s.replace(/\b(def|return|if|elif|else|for|in|while|True|False|break|try|except|print|input|int|len|import)\b/g, '<span class="k">$1</span>'); }

// Same idea as the AI + Python course: a dictionary of keywords → replies, .lower(), and "in" checks. First match wins.
function askRaj(BOT){
  const fab = document.createElement("button"), panel = document.createElement("section");
  fab.className = "cb-fab"; fab.type = "button"; fab.setAttribute("aria-expanded", "false"); fab.setAttribute("aria-controls", "cb-panel");
  fab.innerHTML = '<span aria-hidden="true">☕</span><b>Ask Raj</b>'; fab.title = "Ask Raj: automated chat helper";
  panel.className = "cb-panel"; panel.id = "cb-panel"; panel.hidden = true; panel.setAttribute("aria-label", "Ask Raj chat");
  panel.innerHTML = `<div class="cb-head"><span class="cb-av" aria-hidden="true">☕</span><div><b>Ask Raj</b><small>Automated helper · ${BOT.tagline}</small></div><button class="cb-x" type="button" aria-label="Close chat">×</button></div>
    <div class="cb-log" role="log" aria-live="polite"></div><div class="cb-chips"></div>
    <form class="cb-form"><input name="q" autocomplete="off" placeholder="Type a message…" aria-label="Message" maxlength="200"><button type="submit">Send</button></form>
    <div class="cb-foot">${BOT.foot}</div>`;
  document.body.append(fab, panel);
  const log = panel.querySelector(".cb-log"), chips = panel.querySelector(".cb-chips"), form = panel.querySelector(".cb-form");
  const say = (html, who) => { const m = document.createElement("div"); m.className = "cb-msg " + who; m.innerHTML = html; log.append(m); log.scrollTop = log.scrollHeight; return m; };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
  const setChips = list => { chips.innerHTML = list.map(c => `<button type="button">${c}</button>`).join(""); };
  function reply(text){
    const t = " " + text.toLowerCase().replace(/[^a-z0-9₹&+ ]/g, " ").replace(/\s+/g, " ") + " ";
    const has = k => k.includes(" ") ? t.includes(" " + k + " ") || t.includes(k) : t.includes(" " + k + " ") || (k.length > 4 && t.includes(k));
    for (const [keys, ans] of BOT.rules) if (keys.some(has)) return typeof ans === "function" ? ans(t) : ans;
    return BOT.fallback;
  }
  function ask(text){
    text = text.trim(); if (!text) return;
    say(esc(text), "me");
    const dots = say("Typing…", "bot typing");
    setTimeout(() => { dots.remove(); const r = reply(text); say(r.text || r, "bot"); if (r.chips) setChips(r.chips); }, 450);
  }
  let started = false;
  const open = () => { panel.hidden = false; fab.setAttribute("aria-expanded", "true");
    if (!started) { started = true; say(BOT.hello, "bot"); setChips(BOT.chips); }
    if (matchMedia("(min-width:481px)").matches) form.q.focus(); };
  const close = () => { panel.hidden = true; fab.setAttribute("aria-expanded", "false"); fab.focus(); };
  fab.addEventListener("click", open);
  panel.querySelector(".cb-x").addEventListener("click", close);
  panel.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  chips.addEventListener("click", e => { const b = e.target.closest("button"); if (b) ask(b.textContent); });
  form.addEventListener("submit", e => { e.preventDefault(); ask(form.q.value); form.q.value = ""; });
  log.addEventListener("click", e => { const a = e.target.closest('a[href^="#"]'); if (a && matchMedia("(max-width:480px)").matches) close(); });
}

    [["menu", "chai", "flavour", "flavor", "price", "rate", "kitne ka"], { text: "☕ Aaj ka menu:\nMasala ₹20 · Adrak ₹15 · Elaichi ₹25 · Tulsi ₹30\n\nIn code, this menu is a dictionary: <code>menu = {\"Masala\": 20, ...}</code>. See <a href=\"#python-6\">Lesson 6</a>.", chips: ["order masala", "order adrak", "bill"] }],

// ---------- installable app (PWA) ----------
// Chrome / Edge on Android and desktop: real install prompt. iPhone, in-app browsers (WhatsApp, Instagram, Facebook)
// and browsers without a prompt: the same button opens step-by-step help instead.
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
const ua = navigator.userAgent;
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /Android/.test(ua);
const inApp = /Instagram|FBAN|FBAV|FB_IAB|WhatsApp|Line\/|; wv\)|Snapchat/.test(ua) || (isIOS && !/Safari\//.test(ua));
let installEvt = null;
const installBtn = document.getElementById("install"), help = document.getElementById("install-help");
if (!isStandalone) installBtn.hidden = false; // every browser: a real prompt where offered, step-by-step help elsewhere
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!isStandalone) installBtn.hidden = false; });
addEventListener("appinstalled", () => { installBtn.hidden = true; installEvt = null; });
const SHARE = '<svg class="ih-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>', PLUS = '<svg class="ih-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function installSteps(){
  const site = location.host.replace(/^www\./, "");
  if (inApp) return `<p>You opened this page inside another app (WhatsApp, Instagram or Facebook). Apps can only be installed from your phone's own browser.</p><ol>
      <li>Tap the <b>⋮</b> or <b>⋯</b> menu at the top or bottom of this screen.</li>
      <li>Choose <b>${isIOS ? "Open in Safari" : "Open in Chrome"}</b> (sometimes called "Open in browser").</li>
      <li>Then tap <b>Install app</b> again.</li></ol>
    <p>Or open ${isIOS ? "Safari" : "Chrome"} yourself and type <b>${site}</b> in the address bar at the top (not in a Google search box).</p>`;
  if (isIOS) return /CriOS|FxiOS|EdgiOS/.test(ua)
    ? `<p class="ih-lead">In Chrome on iPhone it also takes 3 taps:</p><ol class="ih-steps">
        <li><span class="ih-n">1</span><span>Tap <b>Share</b> ${SHARE} at the <b>top right</b>, inside the address bar (the arrow above points to it). If it's not there, tap <b>⋯</b> and then <b>Share</b>.</span></li>
        <li><span class="ih-n">2</span><span>Tap <b>Add to Home Screen</b> ${PLUS}. You may need to scroll down or tap <b>More</b>.</span></li>
        <li><span class="ih-n">3</span><span>Tap <b>Add</b>. The app icon appears on your home screen.</span></li></ol>
      <p>Needs iOS 16.4 or newer. On an older iPhone, open the site in <b>Safari</b> instead.</p>
      <div class="ih-arrow up" aria-hidden="true"><span>⬆</span>Share is up here</div>`
    : `<p class="ih-lead">On iPhone, apps from websites are added with Safari's Share button. It takes 3 taps:</p><ol class="ih-steps">
        <li><span class="ih-n">1</span><span>Tap <b>Share</b> ${SHARE} in the bar at the <b>bottom</b> of Safari (the arrow below points to it). If you only see <b>⋯</b>, tap that first, then <b>Share</b>.</span></li>
        <li><span class="ih-n">2</span><span>Scroll down and tap <b>Add to Home Screen</b> ${PLUS}. Not there? Tap <b>Edit Actions</b> at the bottom of the list and add it.</span></li>
        <li><span class="ih-n">3</span><span>Tap <b>Add</b> at the top right. The app icon appears on your home screen.</span></li></ol>
      <div class="ih-arrow" aria-hidden="true">Share is down here<span>⬇</span></div>`;
  if (!isMobile) {
    const edge = /Edg\//.test(ua), safari = /Safari\//.test(ua) && !/Chrome|Chromium|Edg\//.test(ua), firefox = /Firefox\//.test(ua);
    if (firefox) return `<p>Firefox on a computer can't install website apps. Open <b>${site}</b> in <b>Chrome</b> or <b>Edge</b> and click <b>Install app</b> there, or install it on your phone.</p>`;
    if (safari) return `<ol><li>In the menu bar, click <b>File</b>.</li><li>Click <b>Add to Dock</b>.</li><li>Click <b>Add</b>. The app opens from your Dock.</li></ol><p>Needs macOS Sonoma or newer.</p>`;
    if (edge) return `<ol><li>Click the <b>⋯</b> menu at the top right of Edge.</li><li>Go to <b>Apps</b> → <b>Install this site as an app</b>.</li><li>Click <b>Install</b>.</li></ol><p>Already installed? Open it from <b>Apps</b> in the same menu, or from your Start menu.</p>`;
    return `<ol><li>Look for the <b>install icon</b> (a screen with a down arrow) at the right end of Chrome's address bar and click it. Or click <b>⋮</b> → <b>Cast, save and share</b> → <b>Install page as app</b>.</li><li>Click <b>Install</b>. The app gets its own window and a desktop / Start menu shortcut.</li></ol><p>If it says <b>Open in app</b> instead, it's already installed on this computer.</p>`;
  }
  return `<ol><li>Tap the <b>⋮</b> menu at the top right of Chrome.</li><li>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</li><li>Tap <b>Install</b>. The app appears on your home screen.</li></ol>
    <p>If you don't see it, make sure you opened <b>${site}</b> in Chrome itself, not inside WhatsApp or Instagram.</p>`;
}
installBtn.addEventListener("click", async () => {
  if (installEvt) { installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome === "accepted") installBtn.hidden = true; return; }
  help.querySelector(".ih-body").innerHTML = installSteps(); help.classList.toggle("ios", isIOS && !inApp && !/CriOS|FxiOS|EdgiOS/.test(ua)); help.classList.toggle("ios-chrome", isIOS && /CriOS|FxiOS|EdgiOS/.test(ua)); help.showModal();
});
help.addEventListener("click", e => { if (e.target === help || e.target.closest("[data-close]")) help.close(); });
</script>
