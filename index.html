<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samjho with Raj Classroom</title>
<meta name="description" content="Samjho with Raj: free lessons on Python, AI chatbots and AI agents, plus a private Financial Tracker for family money planning. Watch a short video, read the notes, try the code.">
<link rel="icon" href="img/raj-mark.png">
<style>
/* Layout: Skool-style community shell — brand bar + tab row, then Classroom grid / course view with lesson sidebar.
   Palette and type carried over from the original techsamjhoraj.com (paper, ink, brick red, forest green, Georgia). */
:root{
  --paper:#f6f3ec; --card:#fbfaf6; --ink:#202321; --muted:#646860; --line:#d8d9d0;
  --accent:#b93628; --green:#244c41; --green-soft:#e0e8df; --gold:#ece4cf; --red-soft:#efded6;
  --code-bg:#1d211f; --code-fg:#eef0e8; --code-key:#7fd1b9; --code-str:#e5b36b; --code-com:#8d958c;
  --display:Georgia,"Times New Roman",serif;
  --body:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151816; --card:#1c201d; --ink:#ecebe4; --muted:#a3a89f; --line:#30352f;
  --accent:#e0705f; --green:#8cc5ae; --green-soft:#223029; --gold:#2e2a1f; --red-soft:#33221f;
  --code-bg:#0e100f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151816; --card:#1c201d; --ink:#ecebe4; --muted:#a3a89f; --line:#30352f;
  --accent:#e0705f; --green:#8cc5ae; --green-soft:#223029; --gold:#2e2a1f; --red-soft:#33221f;
  --code-bg:#0e100f; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand span{color:var(--accent)}
.lang{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;text-decoration:none;color:var(--muted);font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

main{padding-block:32px 64px;min-height:70vh}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--muted)}
h1,h2,h3{text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;margin:10px 0 12px}
h1 em{color:var(--accent)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.8px;margin:0 0 8px;line-height:1.15}
h3{font-size:18px;margin:0}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:0}
.hindi{color:var(--green);font-size:16px;margin:6px 0 0}

/* classroom */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.stats{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:28px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.course{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.cover{aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;background:#0e1116}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .pill{position:absolute;left:12px;top:12px;background:rgba(14,17,22,.82);color:#f5f1e8;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;letter-spacing:.5px}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody p{margin:0;color:var(--muted);font-size:14.5px}
.meta{font-size:13px;color:var(--muted);margin-top:auto}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.progrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progrow .prog{flex:1}
.note{font-size:13.5px;color:var(--muted);margin-top:26px}

/* course view */
.course-view{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.course-view{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.module{border-bottom:1px solid var(--line)}
.module:last-child{border-bottom:0}
.module summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.module summary::-webkit-details-marker{display:none}
.module summary .count{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.lessons{list-style:none;margin:0;padding:0 8px 10px}
.lesson-link{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.4}
.lesson-link:hover{background:var(--paper)}
.lesson-link[aria-current="true"]{background:var(--green-soft);font-weight:700}
.lesson-link.locked{color:var(--muted);cursor:default}
.lesson-link.locked:hover{background:transparent}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.tick.done{background:var(--green);border-color:var(--green)}
.tick.done:after{content:"";width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick.lock{border-style:dashed}
.soon{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

.lesson{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-top{display:flex;flex-direction:column;gap:4px}
.player{background:#0e1116;border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.player video{display:block;width:100%;max-width:560px;aspect-ratio:1/1;background:#0e1116}
.player.wide video{max-width:100%;aspect-ratio:16/9}
.placeholder{aspect-ratio:16/9;max-width:100%;width:100%;display:grid;place-items:center;text-align:center;color:#d8d9d0;padding:24px;background:#0e1116}
.placeholder b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:#f5f1e8;margin-bottom:6px}
.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.block h3{font-size:13px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:10px}
.block p{margin:0 0 10px;max-width:68ch}
.block p:last-child{margin-bottom:0}
.block ul{margin:0;padding-left:20px;max-width:68ch}
.block li{margin:4px 0}
.takeaway{background:var(--green);color:var(--paper);border-color:var(--green)}
.takeaway h3{color:var(--paper);opacity:.75}
.takeaway p{font-family:var(--display);font-size:24px;line-height:1.3}
.try{background:var(--gold);border-color:transparent}
code{font-family:var(--mono);font-size:.92em;background:var(--green-soft);padding:1px 5px;border-radius:4px}
.codebox{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:10px;overflow:hidden}
.codebox .file{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font:12.5px var(--mono);color:var(--code-com);border-bottom:1px solid rgba(255,255,255,.08)}
.copy{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--code-fg);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.08)}
.codebox pre{margin:0;padding:16px 18px;overflow-x:auto;font:14.5px/1.65 var(--mono)}
.k{color:var(--code-key)} .s{color:var(--code-str)} .c{color:var(--code-com)}
.out{border-top:1px dashed rgba(255,255,255,.14)}
.out pre{color:var(--code-str)}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid var(--ink);border-radius:8px;background:transparent;text-decoration:none;cursor:pointer;font-size:14.5px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.done{background:var(--green);border-color:var(--green);color:var(--paper)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.navbtns{display:flex;gap:10px}

/* other tabs */
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.card p{color:var(--muted);margin:8px 0 0;font-size:15px}
.mail{font-family:var(--mono);font-size:15px;user-select:all;background:var(--green-soft);padding:6px 10px;border-radius:6px;display:inline-block;margin-top:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.timeline li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:8px}
@media (max-width:600px){.timeline li{grid-template-columns:1fr}}
.timeline .course-tag{font-size:12px;color:var(--muted)}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--accent);white-space:nowrap;justify-self:start}
.chip.next{background:var(--green-soft);color:var(--green)}
.about{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:700px){.about{grid-template-columns:1fr}}
.about img{width:180px;height:180px;border-radius:50%;border:4px solid var(--card);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.about p{color:var(--muted);font-size:17px;max-width:62ch}
.principles{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.principles span{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--green)}
.social{display:flex;gap:8px;flex-wrap:wrap}
.social a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink);background:var(--card)}
.social a:hover{border-color:var(--ink)}
/* financial tracker */
:root{--c-ins:#7a5ea8;--c-debt:#b93628;--c-ef:#c98a1b;--c-edu:#2f6f9f;--c-ret:#244c41;--c-home:#8a6f4d;--c-par:#b0577f;--c-free:#b9bcb2;--c-ess:#5d6b66;--c-ann:#a08a5a;--c-fun:#c9b98f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-ins:#b59ae0;--c-debt:#e0705f;--c-ef:#e3b04f;--c-edu:#7fb3dc;--c-ret:#8cc5ae;--c-home:#c4a57e;--c-par:#e08fb2;--c-free:#5a5f57;--c-ess:#7d8c86;--c-ann:#b29a66;--c-fun:#6f6650}}
:root[data-theme="dark"]{--c-ins:#b59ae0;--c-debt:#e0705f;--c-ef:#e3b04f;--c-edu:#7fb3dc;--c-ret:#8cc5ae;--c-home:#c4a57e;--c-par:#e08fb2;--c-free:#5a5f57;--c-ess:#7d8c86;--c-ann:#b29a66;--c-fun:#6f6650}
.fp-disc{background:var(--gold);border-radius:10px;padding:14px 18px;font-size:14px;margin-bottom:22px;max-width:none}
.fp-disc b{color:var(--ink)}
.fp{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1100px){.fp{grid-template-columns:1fr}}
.fp-form{display:flex;flex-direction:column;gap:12px;min-width:0}
.fp-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fp-tools .btn{padding:8px 14px;font-size:13.5px}
.fp-jump{display:none}
@media (max-width:1100px){.fp-jump{display:inline-flex}}
.fp-tools label{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.fp-banner{font-size:13.5px;background:var(--green-soft);color:var(--green);border-radius:8px;padding:9px 12px}
.fp-sec{background:var(--card);border:1px solid var(--line);border-radius:10px}
.fp-sec summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.fp-sec summary::-webkit-details-marker{display:none}
.fp-sec summary:after{content:"+";color:var(--muted);font-weight:400}
.fp-sec[open] summary:after{content:"−"}
.fp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:0 18px 18px}
@media (max-width:420px){.fp-grid{grid-template-columns:1fr}}
.fp-f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;min-width:0}
.fp-f>span{color:var(--muted);font-weight:600;line-height:1.3}
.fp-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.fp-in:focus-within{border-color:var(--ink)}
.fp-in input,.fp-in select{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:9px 10px;font:inherit;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.fp-in input:focus,.fp-in select:focus{outline:none}
.fp-in i{font-style:normal;color:var(--muted);padding:0 10px;font-size:13px;white-space:nowrap}
.fp-in i:first-child{padding-right:0}
.fp-f small{color:var(--muted);font-size:12px;line-height:1.35}
.fp-full{grid-column:1/-1}
.fp-sub{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:var(--muted);margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.fp-kid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr auto;gap:10px;align-items:end}
.fp-x{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--muted)}
.fp-x:hover{color:var(--accent);border-color:var(--accent)}
.fp-add{grid-column:1/-1;justify-self:start;padding:8px 14px;font-size:13.5px}
.fp-res{display:flex;flex-direction:column;gap:18px;min-width:0;container-type:inline-size;scroll-margin-top:130px}
.fp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fp-kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--muted)}
.fp-kpi b{display:block;font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2;margin:2px 0}
.fp-kpi.neg b{color:var(--accent)}
.fp-stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--line);margin:4px 0 12px}
.fp-stack i{display:block;height:100%;min-width:0}
.fp-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);list-style:none;margin:0;padding:0}
.fp-legend li{display:flex;align-items:center;gap:6px}
.fp-dot{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.fp-split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
@container (max-width:600px){.fp-split{grid-template-columns:1fr;justify-items:center}}
.fp-donut{width:200px;height:200px}
.fp-donut text{fill:var(--ink);font-family:var(--body)}
.fp-tw{overflow-x:auto;width:100%}

.fp-table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.fp-table td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.fp-table tr:last-child td{border-bottom:0}
.fp-table .r{text-align:right;white-space:nowrap}
.fp-table small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.fp-phase{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--accent);margin-bottom:8px}
.fp-phase.ok{background:var(--green-soft);color:var(--green)}
.fp-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fp-check{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.fp-check h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fp-check p{margin:0;color:var(--muted)}
.fp-check .big{font-family:var(--display);font-size:20px;color:var(--ink)}
.fp-as{border:0;background:transparent;padding:0;color:var(--green);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.fp-res .block p,.fp-res .block li{font-size:14.5px}
@media print{header,footer,.fp-form,.fp-tools{display:none!important}.fp{grid-template-columns:1fr}.fp-sec,.block,.fp-kpi,.fp-check{break-inside:avoid}}

<script>
// ---------- course content (notes from the videos) ----------
const PY = (code) => code.trim();
const COURSES = [
{
  id: "python", title: "Python with Chai", tag: "10 lessons · live",
  cover: "media/python-7.jpg",
  blurb: "Learn Python basics while making chai. From variables to while loops, each lesson has a 30-second video and notes.",
  modules: [{ title: "Python basics", lessons: [
  { id:"python-1", title:"Chai is a Python program", video:"media/python-1.mp4",
    concept:["A chai recipe and a Python program work the same way.",
      "The ingredients (water, milk, tea leaves, sugar) are <b>variables</b>: a name with a value stored in it.",
      "The recipe is a <b>function</b>: write the steps once, run them whenever you want.",
      "\"Keep heating until it boils\" is a <b>while loop</b>: the work repeats as long as the condition is true."],
    code:PY(`paani = "1 cup"
cheeni = 1

temp = 20
while temp < 100:
    temp = temp + 20      # keep heating
print("Chai ready!")`), output:"Chai ready!",
    practice:["Create 4 variables for the ingredients of your favourite chai.","Change <code>temp + 20</code> to <code>temp + 40</code>. How many times does the loop run now?"],
    takeaway:"If you can make chai, you can learn Python." },

// ---------- tiny python highlighter ----------
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(code){
  return code.split("\n").map(line => {
    let out = "", rest = line, m;
    const re = /("[^"]*"|'[^']*'|#.*$)/;
    while ((m = re.exec(rest))) {
      out += kw(esc(rest.slice(0, m.index)));
      out += m[0][0] === "#" ? `<span class="c">${esc(m[0])}</span>` : `<span class="s">${esc(m[0])}</span>`;
      rest = rest.slice(m.index + m[0].length);
    }
    return out + kw(esc(rest));
  }).join("\n");
}
function kw(s){ return s.replace(/\b(def|return|if|elif|else|for|in|while|True|False|break|try|except|print|input|int|len|import)\b/g, '<span class="k">$1</span>'); }

  Object.keys(s.exp).forEach(k => s.exp[k] = 0); s.savings = s.epf = s.invest = s.health = s.term = 0; s.earners = 1; return s; }
let fp = fpVerma();
try { const saved = JSON.parse(localStorage.getItem(FP_KEY) || "null");
  if (saved) { const d = fpVerma(); fp = { ...d, ...saved, exp:{ ...d.exp, ...saved.exp }, a:{ ...FP_ASSUME, ...saved.a }, homeGoal:{ ...d.homeGoal, ...saved.homeGoal } }; } } catch (e) {}
function fpSave(){ try { fp.remember ? localStorage.setItem(FP_KEY, JSON.stringify(fp)) : localStorage.removeItem(FP_KEY); } catch (e) {} }

const fpGet = p => p.split(".").reduce((o, k) => o == null ? o : o[k], fp);
function fpSet(p, v){ const ks = p.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], fp)[last] = v; }
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
function inrShort(n){ n = Math.round(n); const a = Math.abs(n);
  if (a >= 1e7) return "₹" + (n / 1e7).toFixed(2).replace(/\.?0+$/, "") + " crore";
  if (a >= 1e5) return "₹" + (n / 1e5).toFixed(2).replace(/\.?0+$/, "") + " lakh";
  return inr(n); }
const pctOf = (x, y) => y > 0 ? Math.round(100 * x / y) : 0;
// Monthly investment that grows to fv in `years` at an assumed yearly return (illustrative, not guaranteed).
function sipFor(fv, years, ret){ if (fv <= 0) return 0; const r = Math.pow(1 + ret / 100, 1 / 12) - 1, n = Math.round(years * 12);
  return r > 0 ? fv * r / (Math.pow(1 + r, n) - 1) : fv / n; }

function fpCalc(s){
  const a = s.a, e = s.exp;
  const essentials = e.housing + e.groceries + e.utilities + e.transport + e.school + e.health + e.emi;
  const spend = essentials + e.annual + e.leisure + e.other;
  const surplus = s.income - spend, avail = Math.max(0, surplus);
  const kids = s.kids.length, nonEarning = Math.max(0, s.adults - s.earners), deps = kids + s.parents + nonEarning;

  // 1. Emergency fund: months of essential expenses
  const efWhy = [];
  let m = { govt:4, private:6, variable:9 }[s.job] || 6;
  efWhy.push(`${m} months for ${{ govt:"a very stable job", private:"a private-sector salary", variable:"self-employed or variable income" }[s.job]}`);
  if (s.earners <= 1) { m += 1; efWhy.push("+1 for a single income"); }
  if (deps >= 3) { m += 1; efWhy.push(`+1 for ${deps} dependants`); }
  m = Math.min(m, 12);
  const efAuto = m; if (s.efMonths > 0) m = s.efMonths;
  const efTarget = m * essentials, efGap = Math.max(0, efTarget - s.savings);

  // 2. Insurance (rules of thumb)
  const healthNeed = ((s.city === "metro" ? a.hMetro : a.hNon) + (s.adults + kids > 4 ? 5 : 0)) * 1e5;
  const healthGap = Math.max(0, healthNeed - s.health);
  const parentNeed = s.parents * a.hParent * 1e5, parentGap = Math.max(0, parentNeed - s.parentsHealth);
  const loansTotal = s.loans.reduce((n, l) => n + l.amt, 0);
  const needsTerm = deps > 0 || s.adults > 1;
  const termNeed = needsTerm ? a.termMult * 12 * s.income + loansTotal : 0, termGap = Math.max(0, termNeed - s.term);
  const insMonthly = (healthGap / 1e5 * a.hPrem + parentGap / 1e5 * a.pPrem + termGap / 1e6 * a.tPrem) / 12;

  // 3. Costly debt
  const hiLoans = s.loans.filter(l => l.amt > 0 && l.rate >= a.hiRate), hiTotal = hiLoans.reduce((n, l) => n + l.amt, 0);
  const debtMonthly = hiTotal / Math.max(1, a.debtMonths);
  const efMonthly = efGap / Math.max(1, a.efMonths);

  // 4. Long-term goals
  const retFor = y => y >= 7 ? a.eqRet : a.safeRet;
  const goals = [];
  s.kids.forEach((k, i) => { const y = Math.max(0, a.college - k.age), fv = k.cost * Math.pow(1 + a.eduInfl / 100, y);
    goals.push({ key:"edu", name:`Child ${i + 1}: college (now ${k.age})`, years:y, today:k.cost, fv, infl:"eduInfl", ret:retFor(y), sip:y > 0 ? sipFor(fv, y, retFor(y)) : 0, dueNow:y === 0 }); });
  const ry = Math.max(0, a.retAge - s.age);
  const living = e.groceries + e.utilities + e.transport + e.health + e.annual + e.leisure + e.other + (s.home === "rent" ? e.housing : 0);
  const atRet = living * Math.pow(1 + a.infl / 100, ry), T = Math.max(1, a.life - a.retAge);
  const rr = (1 + a.postRet / 100) / (1 + a.infl / 100) - 1;
  const corpus = 12 * atRet * (Math.abs(rr) > 1e-6 ? (1 - Math.pow(1 + rr, -T)) / rr * (1 + rr) : T);
  const existing = s.epf * Math.pow(1 + a.epfRet / 100, ry) + s.invest * Math.pow(1 + a.eqRet / 100, ry);
  const retNeed = Math.max(0, corpus - existing);
  goals.push({ key:"ret", name:"Retirement", years:ry, today:living, fv:corpus, existing, infl:"infl", ret:a.eqRet, sip:ry > 0 ? sipFor(retNeed, ry, a.eqRet) : 0, dueNow:ry === 0 });
  if (s.home === "rent" && s.homeGoal.on && s.homeGoal.price > 0) { const h = s.homeGoal, y = Math.max(1, h.years), fv = h.price * h.down / 100 * Math.pow(1 + a.homeInfl / 100, y);
    goals.push({ key:"home", name:`Home down payment (${h.down}%)`, years:y, today:h.price * h.down / 100, fv, infl:"homeInfl", ret:retFor(y), sip:sipFor(fv, y, retFor(y)) }); }
  if (s.parents > 0 && a.parentFund > 0) { const y = Math.max(1, a.parentYears), fv = s.parents * a.parentFund * Math.pow(1 + a.infl / 100, y);
    goals.push({ key:"par", name:"Parents' care fund", years:y, today:s.parents * a.parentFund, fv, infl:"infl", ret:a.safeRet, sip:sipFor(fv, y, a.safeRet) }); }
  const goalNeed = goals.reduce((n, g) => n + g.sip, 0);

  // Split the surplus: keep a small share for long-term goals, fill safety buckets in order, the rest goes to goals.
  const reserved = Math.min(goalNeed, avail * a.goalFloor / 100);
  let pool = avail - reserved;
  const take = want => { const x = Math.min(pool, want); pool -= x; return x; };
  const ins = take(insMonthly), debt = take(debtMonthly), ef = take(efMonthly);
  const goalAlloc = reserved + Math.min(pool, goalNeed - reserved);
  pool -= goalAlloc - reserved;
  const share = goalNeed > 0 ? goalAlloc / goalNeed : 0;
  goals.forEach(g => g.got = g.sip * share);
  const sumKey = k => goals.filter(g => g.key === k).reduce((n, g) => n + g.got, 0);
  const buckets = [
    { key:"ins", name:"Insurance gaps (premiums)", color:"var(--c-ins)", amt:ins, why:"Buy the missing health and term cover first. Premium is a rough estimate." },
    { key:"debt", name:"Pay off costly debt", color:"var(--c-debt)", amt:debt, why:`Loans at ${a.hiRate}% or more, cleared in about ${a.debtMonths} months, on top of the normal EMI.` },
    { key:"ef", name:"Emergency fund", color:"var(--c-ef)", amt:ef, why:`Fill the gap in about ${a.efMonths} months. Keep it in a savings account, FD or liquid fund.` },
    { key:"edu", name:"Children's education", color:"var(--c-edu)", amt:sumKey("edu"), why:"One pot per child, invested until college." },
    { key:"ret", name:"Retirement", color:"var(--c-ret)", amt:sumKey("ret"), why:"On top of EPF deducted from salary." },
    { key:"home", name:"Home down payment", color:"var(--c-home)", amt:sumKey("home"), why:"Short goals stay in safer options." },
    { key:"par", name:"Parents' care fund", color:"var(--c-par)", amt:sumKey("par"), why:"For medical bills and support, in safer options." },
    { key:"free", name:"Not yet assigned", color:"var(--c-free)", amt:pool, why:"Every goal is covered at these assumptions. Use it to reach goals sooner or for planned wants." },
  ].filter(b => b.amt >= 1);
  const safetyOpen = insMonthly + debtMonthly + efMonthly > 0;
  return { essentials, spend, surplus, avail, deps, kids, efMonths:m, efAuto, efWhy, efTarget, efGap, healthNeed, healthGap, parentNeed, parentGap,
    needsTerm, termNeed, termGap, loansTotal, insMonthly, hiLoans, hiTotal, debtMonthly, efMonthly, goals, goalNeed, goalAlloc, buckets, safetyOpen, corpus, existing, atRet, ry, T };
}

// ----- results -----
const fpA = (k, text) => `<button type="button" class="fp-as" data-focus="${k}" title="Change this assumption">${text}</button>`;
function fpDonut(buckets, total){
  const C = 2 * Math.PI * 70; let off = 0;
  const arcs = buckets.map(b => { const len = total > 0 ? C * b.amt / total : 0;
    const el = `<circle r="70" cx="100" cy="100" fill="none" stroke="${b.color}" stroke-width="26" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${b.name}: ${inr(b.amt)}</title></circle>`;
    off += len; return el; }).join("");
  return `<svg class="fp-donut" viewBox="0 0 200 200" role="img" aria-label="Split of your monthly surplus">
    <circle r="70" cx="100" cy="100" fill="none" stroke="var(--line)" stroke-width="26"/>${arcs}
    <text x="100" y="96" text-anchor="middle" font-size="12" opacity=".7">surplus</text>
    <text x="100" y="118" text-anchor="middle" font-size="19" font-weight="700">${inrShort(total)}</text></svg>`;
}

  const flex = e.leisure + e.other;
  const kpis = `<div class="fp-kpis">

    <div class="fp-kpi ${r.surplus < 0 ? "neg" : ""}">Monthly surplus<b>${inr(r.surplus)}</b>${r.surplus >= 0 ? pctOf(r.surplus, s.income) + "% saving rate" : "spending more than income"}</div></div>`;

    <ul class="fp-legend"><li><span class="fp-dot" style="background:var(--c-ess)"></span>Essentials ${inr(r.essentials)}</li><li><span class="fp-dot" style="background:var(--c-ann)"></span>Yearly costs ${inr(e.annual)}</li><li><span class="fp-dot" style="background:var(--c-fun)"></span>Leisure and other ${inr(flex)}</li><li><span class="fp-dot" style="background:var(--c-ret)"></span>Surplus to plan ${inr(r.avail)}</li></ul></section>`;

  let split;
  if (r.surplus <= 0) split = `<section class="block"><h3>Your monthly split</h3><p><b>There is no surplus to split yet.</b> Your expenses are ${inr(-r.surplus)} a month more than your income${r.surplus === 0 ? " (exactly equal)" : ""}.</p>
    <p>Safety first: list every expense for one month, cut what you can from leisure and "anything else", and avoid new credit-card or app loans to fill the gap. Even ₹1,000 a month into an emergency fund is a start.</p></section>`;
  else split = `<section class="block"><h3>Your monthly split · ${inr(r.avail)}</h3>
    <span class="fp-phase ${r.safetyOpen ? "" : "ok"}">${r.safetyOpen ? "Stage 1: build safety first" : "Stage 2: safety done, grow long-term goals"}</span>
    <div class="fp-split">${fpDonut(r.buckets, r.avail)}
      <div class="fp-tw"><table class="fp-table"><thead><tr><th>Bucket</th><th class="r">₹ a month</th><th class="r">Share</th></tr></thead><tbody>
      ${r.buckets.map((b, i) => `<tr><td><span class="fp-dot" style="background:${b.color};margin-right:6px"></span><b>${b.name}</b><small>${b.why}</small></td><td class="r">${inr(b.amt)}</td><td class="r">${pctOf(b.amt, r.avail)}%</td></tr>`).join("")}

  const status = ok => `<span class="chip ${ok ? "next" : ""}">${ok ? "OK" : "Gap"}</span>`;
  const prog = (have, need) => `<div class="prog"><i style="width:${need > 0 ? Math.min(100, 100 * have / need) : 100}%"></i></div>`;
  const checks = `<section class="block"><h3>Safety check</h3><div class="fp-checks">
    <div class="fp-check"><h4>Emergency fund ${status(r.efGap <= 0)}</h4><span class="big">${inrShort(r.efTarget)}</span>
      <p>${r.efMonths} months of essentials (${inr(r.essentials)}). ${s.efMonths > 0 ? "You set this." : r.efWhy.join(", ") + "."}</p>${prog(s.savings, r.efTarget)}
      <p>You have ${inrShort(s.savings)}${r.efGap > 0 ? ` · gap ${inrShort(r.efGap)}` : " · covered"}.</p></div>
    <div class="fp-check"><h4>Health cover ${status(r.healthGap <= 0 && r.parentGap <= 0)}</h4><span class="big">${inrShort(r.healthNeed)}</span>
      <p>Family floater, ${fpA(s.city === "metro" ? "a.hMetro" : "a.hNon", `rule of thumb for a ${s.city === "metro" ? "metro" : "non-metro"} city`)}. You have ${inrShort(s.health)}.</p>${prog(s.health, r.healthNeed)}
      ${s.parents ? `<p>Parents: ${fpA("a.hParent", `${inrShort(a.hParent * 1e5)} each`)}, separate policy. You have ${inrShort(s.parentsHealth)}.</p>` : ""}</div>
    <div class="fp-check"><h4>Term life cover ${status(r.termGap <= 0)}</h4>${r.needsTerm ? `<span class="big">${inrShort(r.termNeed)}</span>
      <p>${fpA("a.termMult", `${a.termMult}× yearly income`)}${r.loansTotal ? ` + loans ${inrShort(r.loansTotal)}` : ""}. Split it between earners by income. You have ${inrShort(s.term)}.</p>${prog(s.term, r.termNeed)}`
      : `<p>No one depends on your income, so term cover may not be needed yet.</p>`}</div>
    <div class="fp-check"><h4>Costly debt ${status(r.hiTotal <= 0)}</h4><span class="big">${r.hiTotal ? inrShort(r.hiTotal) : "None"}</span>
      <p>${r.hiTotal ? r.hiLoans.map(l => `${l.name} ${inrShort(l.amt)} at ${l.rate}%`).join(" · ") + `. Paying it off saves that interest for sure.` : `No loans at ${fpA("a.hiRate", `${a.hiRate}% or more`)}. Lower-rate loans (home, education) can keep their normal EMI.`}</p></div>
  </div>${r.insMonthly > 0 ? `<p style="margin-top:12px;color:var(--muted);font-size:13.5px">Estimated premium for the missing cover: about ${inr(r.insMonthly)} a month, using ${fpA("a.hPrem", "rough premium rates")}. Real premiums depend on age and health, so get quotes.</p>` : ""}</section>`;

  const goals = `<section class="block"><h3>Long-term goals</h3><div class="fp-tw"><table class="fp-table">
    <thead><tr><th>Goal</th><th class="r">Money needed then</th><th class="r">Needed a month</th><th class="r">In this plan</th></tr></thead><tbody>
    ${r.goals.map(g => `<tr><td><b>${g.name}</b><small>${g.dueNow ? "Due now" : `In ${g.years} years`} · ${g.key === "ret"
        ? `living costs ${inr(g.today)}/month today → ${inr(r.atRet)}/month at ${a.retAge}, for ${r.T} years, at ${fpA("a.infl", `${a.infl}% inflation`)} and ${fpA("a.postRet", `${a.postRet}% return after retiring`)}. EPF/PPF and investments may grow to ${inrShort(g.existing)} (${fpA("a.epfRet", `${a.epfRet}%`)} / ${fpA("a.eqRet", `${a.eqRet}%`)}).`
        : `${inrShort(g.today)} today at ${fpA(g.infl, `${a[g.infl]}% a year cost growth`)}`}${g.dueNow ? "" : ` · invested at ${fpA(g.ret === a.eqRet ? "a.eqRet" : "a.safeRet", `${g.ret}% assumed return`)}`}</small></td>
      <td class="r">${inrShort(g.fv)}${g.years > 0 ? `<small>≈ ${inrShort(g.fv / Math.pow(1 + a.infl / 100, g.years))} in today's money</small>` : ""}</td><td class="r">${g.dueNow ? "—" : inr(g.sip)}</td><td class="r">${g.dueNow ? "—" : inr(g.got)}${!g.dueNow && g.sip > 0 ? `<small>${pctOf(g.got, g.sip)}% of need</small>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <p style="margin-top:12px;color:var(--muted);font-size:13.5px">"Needed a month" is what would reach the goal if the assumed return actually happens. Returns are not guaranteed and can be lower. A gap today is normal: it shrinks as safety buckets fill, income grows and you step up your monthly amount.</p></section>`;

  const tips = [];
  if (s.loans[0].amt > 0) tips.push("Credit-card dues often cost 36–42% a year. Pay the full bill, not the minimum, and stop new spending on the card until it is cleared.");
  if (s.savings > r.efTarget && r.hiTotal > 0) tips.push(`Your savings are ${inrShort(s.savings - r.efTarget)} above the emergency target. Using that extra to clear costly debt could be worth considering.`);
  else if (s.savings > r.efTarget * 1.25 && r.efTarget > 0) tips.push(`Your savings are ${inrShort(s.savings - r.efTarget)} above the emergency target. The extra could be moved into your goal pots.`);
  if (s.health > 0) tips.push("An employer group policy usually ends when you leave the job. A personal family floater keeps you covered between jobs.");
  if (r.needsTerm && r.termGap > 0) tips.push("For life cover, a pure term plan usually gives the most cover per rupee. Avoid buying insurance as an investment.");
  if (e.annual === 0) tips.push("Yearly costs (festivals, admissions, insurance renewals) are set to zero. Spreading them over 12 months stops them from breaking the emergency fund.");
  if (s.kids.length && r.goals.some(g => g.key === "edu" && g.got < g.sip)) tips.push("Education goals have fixed dates, so they cannot be postponed the way retirement savings sometimes can. Review them every year.");
  tips.push("EPF deducted from your salary is not part of take-home, so it is extra retirement saving on top of this plan.");
  tips.push("Revisit this plan once a year, and after any salary change, new child, loan or job change.");

  return `${kpis}${bar}${split}${checks}${goals}
    <section class="block"><h3>Things to keep in mind</h3><ul>${tips.map(t => `<li>${t}</li>`).join("")}</ul></section>
    <p class="fp-disc"><b>Educational and illustrative only.</b> This is not financial, investment, tax or insurance advice. Returns and inflation are assumptions you can change; no return is guaranteed and markets can fall. Insurance amounts are rules of thumb and premiums are rough guesses. For decisions about your own money, speak to a SEBI-registered investment adviser.</p>
    <div class="fp-tools"><button type="button" class="btn" onclick="print()">Print or save as PDF</button></div>`;
}

function tracker(){
  return `<div class="page-head"><div><div class="eyebrow">Financial Tracker</div>
      <h1>Your family's <em>money plan</em>, one bucket at a time.</h1>
      <p class="lead">Enter your household, income and expenses. See how much of your monthly surplus could go to the emergency fund, insurance, costly debt and long-term goals: safety first, then the future.</p>
      <p class="hindi">Companion to the "Middle-Class Family Ka Money Plan" video series.</p></div></div>
    <p class="fp-disc"><b>Private:</b> everything is calculated in your browser. Nothing you type is sent anywhere. <b>Educational only:</b> the numbers are illustrations based on assumptions you can change, not advice.</p>
    <div class="fp">${fpForm()}<div class="fp-res" id="fp-res" aria-live="polite">${fpResults()}</div></div>`;
}
function fpAmtHints(){ document.querySelectorAll("[data-amt]").forEach(el => { const v = +fpGet(el.dataset.amt) || 0; el.textContent = v >= 1e5 ? inrShort(v) : ""; });
  const ef = document.querySelector('#fp-form [data-k="efMonths"]'); if (ef) ef.placeholder = "auto: " + fpCalc(fp).efAuto; }
function fpRedraw(full){
  fpSave();
  if (full) { const y = scrollY, open = [...document.querySelectorAll(".fp-sec")].map(d => d.open), f = document.activeElement?.dataset?.k;
    app.innerHTML = tracker(); document.querySelectorAll(".fp-sec").forEach((d, i) => d.open = open[i] ?? d.open);
    if (f) document.querySelector(`[data-k="${f}"]`)?.focus(); scrollTo(0, y); }
  else document.getElementById("fp-res").innerHTML = fpResults();
  fpAmtHints();
}
app.addEventListener("input", e => {
  const el = e.target.closest("#fp-form [data-k]"); if (!el) return;
  const k = el.dataset.k;
  if (el.type === "checkbox") fpSet(k, el.checked);
  else if (el.tagName === "SELECT") fpSet(k, el.value);
  else { const v = parseFloat(el.value); fpSet(k, isFinite(v) && v > 0 ? Math.min(v, 1e10) : 0); }
  if (k !== "remember") { fp.example = false; document.querySelector(".fp-banner")?.remove(); }
  // Changes that add or remove form fields redraw the form; the rest only redraw the results.
  fpRedraw(["home", "parents", "homeGoal.on"].includes(k));
});
app.addEventListener("click", e => {
  const b = e.target.closest("[data-fp],[data-del],[data-focus]"); if (!b || !document.getElementById("fp-form")) return;
  if (b.dataset.fp === "verma") { fp = { ...fpVerma(), remember:fp.remember }; fpRedraw(true); }
  else if (b.dataset.fp === "clear") { fp = { ...fpBlank(), remember:fp.remember }; fpRedraw(true); }
  else if (b.dataset.fp === "jump") document.getElementById("fp-res").scrollIntoView({ block:"start" });
  else if (b.dataset.fp === "kid") { fp.kids.push({ age:5, cost:1000000 }); fp.example = false; fpRedraw(true); }
  else if (b.dataset.del != null) { fp.kids.splice(+b.dataset.del, 1); fp.example = false; fpRedraw(true); }
  else if (b.dataset.focus) { const inp = document.querySelector(`#fp-form [data-k="${b.dataset.focus}"]`); if (!inp) return;
    inp.closest("details").open = true; inp.scrollIntoView({ block:"center" }); inp.focus({ preventScroll:true }); inp.select?.(); }
});

function render(){
  const h = (location.hash || "#classroom").slice(1);
  const [c, l] = find(h);
  let tab = "classroom";
  if (c) app.innerHTML = lessonView(c, l);
  else if (h === "tracker") { app.innerHTML = tracker(); tab = h; fpAmtHints(); }
  else if (h === "upcoming") { app.innerHTML = upcoming(); tab = h; }
  else if (h === "community") { app.innerHTML = community(); tab = h; }
  else if (h === "about") { app.innerHTML = about(); tab = h; }
  else app.innerHTML = classroom();
  document.querySelectorAll(".tab").forEach(t => t.dataset.tab === tab ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
  fillSocial();
  document.title = c ? `${l.title} · Samjho with Raj` : tab === "tracker" ? "Financial Tracker · Samjho with Raj" : "Samjho with Raj Classroom";
}

app.addEventListener("click", e => {
  const copy = e.target.closest(".copy");
  if (copy) {
    const text = decodeURIComponent(copy.dataset.code);
    const ok = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(copy.closest(".codebox").querySelector("pre")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "Selected, press Ctrl+C"; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
  }
  const mark = e.target.closest("#mark");
  if (mark) { const id = mark.dataset.id; done.has(id) ? done.delete(id) : done.add(id); save(); const y = scrollY; render(); scrollTo(0, y); }
});
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
