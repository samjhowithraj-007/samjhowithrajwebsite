<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Samjho with Raj Classroom</title>
<meta name="description" content="Samjho with Raj: free lessons on Python, AI chatbots and AI agents. Watch a short video, read the notes, try the code.">
<link rel="icon" href="img/raj-mark.png">
<style>
/* Layout: Skool-style community shell — brand bar + tab row, then Classroom grid / course view with lesson sidebar.
   Palette and type carried over from the original samjhowithraj.online (paper, ink, brick red, forest green, Georgia). */
:root{
  --paper:#f6f3ec; --card:#fbfaf6; --ink:#202321; --muted:#646860; --line:#d8d9d0;
  --accent:#b93628; --green:#244c41; --green-soft:#e0e8df; --gold:#ece4cf; --red-soft:#efded6;
  --code-bg:#1d211f; --code-fg:#eef0e8; --code-key:#7fd1b9; --code-str:#e5b36b; --code-com:#8d958c;
  --display:Georgia,"Times New Roman",serif;
  --body:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Cascadia Code",Consolas,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151816; --card:#1c201d; --ink:#ecebe4; --muted:#a3a89f; --line:#30352f;
  --accent:#e0705f; --green:#8cc5ae; --green-soft:#223029; --gold:#2e2a1f; --red-soft:#33221f;
  --code-bg:#0e100f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151816; --card:#1c201d; --ink:#ecebe4; --muted:#a3a89f; --line:#30352f;
  --accent:#e0705f; --green:#8cc5ae; --green-soft:#223029; --gold:#2e2a1f; --red-soft:#33221f;
  --code-bg:#0e100f; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* header */
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.5px}
.brand img{width:40px;height:40px;border-radius:50%}
.brand span{color:var(--accent)}
.lang{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;text-decoration:none;color:var(--muted);font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

main{padding-block:32px 64px;min-height:70vh}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--muted)}
h1,h2,h3{text-wrap:balance}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-1.5px;margin:10px 0 12px}
h1 em{color:var(--accent)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,34px);letter-spacing:-.8px;margin:0 0 8px;line-height:1.15}
h3{font-size:18px;margin:0}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:0}
.hindi{color:var(--green);font-size:16px;margin:6px 0 0}

/* classroom */
.page-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.stats{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.stats b{display:block;font-family:var(--display);font-size:28px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.course{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.cover{aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden;background:#0e1116}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .pill{position:absolute;left:12px;top:12px;background:rgba(14,17,22,.82);color:#f5f1e8;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;letter-spacing:.5px}
.cbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody p{margin:0;color:var(--muted);font-size:14.5px}
.meta{font-size:13px;color:var(--muted);margin-top:auto}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.progrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progrow .prog{flex:1}
.note{font-size:13.5px;color:var(--muted);margin-top:26px}

/* course view */
.course-view{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.course-view{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);max-height:calc(100vh - 150px);overflow:auto}
@media (max-width:900px){.side{position:static;max-height:none}}
.side-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.module{border-bottom:1px solid var(--line)}
.module:last-child{border-bottom:0}
.module summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.module summary::-webkit-details-marker{display:none}
.module summary .count{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.lessons{list-style:none;margin:0;padding:0 8px 10px}
.lesson-link{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.4}
.lesson-link:hover{background:var(--paper)}
.lesson-link[aria-current="true"]{background:var(--green-soft);font-weight:700}
.lesson-link.locked{color:var(--muted);cursor:default}
.lesson-link.locked:hover{background:transparent}
.tick{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.tick.done{background:var(--green);border-color:var(--green)}
.tick.done:after{content:"";width:5px;height:9px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick.lock{border-style:dashed}
.soon{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

.lesson{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-top{display:flex;flex-direction:column;gap:4px}
.player{background:#0e1116;border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.player video{display:block;width:100%;max-width:560px;aspect-ratio:1/1;background:#0e1116}
.player.wide video{max-width:100%;aspect-ratio:16/9}
.placeholder{aspect-ratio:16/9;max-width:100%;width:100%;display:grid;place-items:center;text-align:center;color:#d8d9d0;padding:24px;background:#0e1116}
.placeholder b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:#f5f1e8;margin-bottom:6px}
.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.block h3{font-size:13px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:10px}
.block p{margin:0 0 10px;max-width:68ch}
.block p:last-child{margin-bottom:0}
.block ul{margin:0;padding-left:20px;max-width:68ch}
.block li{margin:4px 0}
.takeaway{background:var(--green);color:var(--paper);border-color:var(--green)}
.takeaway h3{color:var(--paper);opacity:.75}
.takeaway p{font-family:var(--display);font-size:24px;line-height:1.3}
.try{background:var(--gold);border-color:transparent}
code{font-family:var(--mono);font-size:.92em;background:var(--green-soft);padding:1px 5px;border-radius:4px}
.codebox{position:relative;background:var(--code-bg);color:var(--code-fg);border-radius:10px;overflow:hidden}
.codebox .file{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font:12.5px var(--mono);color:var(--code-com);border-bottom:1px solid rgba(255,255,255,.08)}
.copy{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--code-fg);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.08)}
.codebox pre{margin:0;padding:16px 18px;overflow-x:auto;font:14.5px/1.65 var(--mono)}
.k{color:var(--code-key)} .s{color:var(--code-str)} .c{color:var(--code-com)}
.out{border-top:1px dashed rgba(255,255,255,.14)}
.out pre{color:var(--code-str)}
.lesson-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid var(--ink);border-radius:8px;background:transparent;text-decoration:none;cursor:pointer;font-size:14.5px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.done{background:var(--green);border-color:var(--green);color:var(--paper)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.navbtns{display:flex;gap:10px}

/* other tabs */
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.card p{color:var(--muted);margin:8px 0 0;font-size:15px}
.mail{font-family:var(--mono);font-size:15px;user-select:all;background:var(--green-soft);padding:6px 10px;border-radius:6px;display:inline-block;margin-top:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.timeline li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:8px}
@media (max-width:600px){.timeline li{grid-template-columns:1fr}}
.timeline .course-tag{font-size:12px;color:var(--muted)}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--accent);white-space:nowrap;justify-self:start}
.chip.next{background:var(--green-soft);color:var(--green)}
.about{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:700px){.about{grid-template-columns:1fr}}
.about img{width:180px;height:180px;border-radius:50%;border:4px solid var(--card);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.about p{color:var(--muted);font-size:17px;max-width:62ch}
.principles{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.principles span{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--green)}
.social{display:flex;gap:8px;flex-wrap:wrap}
.social a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;color:var(--ink);background:var(--card)}
.social a:hover{border-color:var(--ink)}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#classroom"><img src="img/raj-mark.png" alt="">Samjho <span>with</span> Raj</a>
    <div class="social" data-social></div>
  </div>
  <nav class="wrap tabs" aria-label="Sections">
    <a class="tab" href="#classroom" data-tab="classroom">Classroom</a>
    <a class="tab" href="#upcoming" data-tab="upcoming">Upcoming</a>
    <a class="tab" href="#community" data-tab="community">Community</a>
    <a class="tab" href="#about" data-tab="about">About</a>
  </nav>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap"><span>© 2026 Samjho with Raj</span><div class="social" data-social></div><span>Progress is saved only in this browser. No sign-up, no tracking.</span></div></footer>

<script>
// ---------- course content (notes from the videos) ----------
const PY = (code) => code.trim();
const COURSES = [
{
  id: "python", title: "Python with Chai", tag: "10 lessons · live",
  cover: "media/python-7.jpg",
  blurb: "Learn Python basics while making chai. From variables to while loops, each lesson has a 30-second video and notes.",
  modules: [{ title: "Python basics", lessons: [
  { id:"python-1", title:"Chai is a Python program", video:"media/python-1.mp4",
    concept:["A chai recipe and a Python program work the same way.",
      "The ingredients (water, milk, tea leaves, sugar) are <b>variables</b>: a name with a value stored in it.",
      "The recipe is a <b>function</b>: write the steps once, run them whenever you want.",
      "\"Keep heating until it boils\" is a <b>while loop</b>: the work repeats as long as the condition is true."],
    code:PY(`paani = "1 cup"
cheeni = 1

temp = 20
while temp < 100:
    temp = temp + 20      # keep heating
print("Chai ready!")`), output:"Chai ready!",
    practice:["Create 4 variables for the ingredients of your favourite chai.","Change <code>temp + 20</code> to <code>temp + 40</code>. How many times does the loop run now?"],
    takeaway:"If you can make chai, you can learn Python." },
  { id:"python-2", title:"Run a function", video:"media/python-2.mp4",
    concept:["You write a function with <code>def</code>. Writing it doesn't run it; Python just remembers it.",
      "Add <code>()</code> after the name to RUN it. This is called <b>calling</b> the function.",
      "<code>return</code> sends an answer back from the function, which you can store in a variable."],
    code:PY(`def chai_banao():
    print("Paani ubla")
    print("Patti daali")
    print("Doodh daala")
    return "Chai ready!"

cup = chai_banao()
print(cup)`), output:"Paani ubla\nPatti daali\nDoodh daala\nChai ready!",
    practice:["Call <code>chai_banao()</code> twice. How many times does the output appear?","Write a new function called <code>coffee_banao()</code>."],
    takeaway:"Functions: write once, run any time." },
  { id:"python-3", title:"if-else: how much sugar?", video:"media/python-3.mp4",
    concept:["<code>if</code> checks a condition. If it's true, the code inside it runs.",
      "If the condition is false, the <code>else</code> path runs instead.",
      "Two paths, one decision. This is how a computer makes choices."],
    code:PY(`cheeni = 2

if cheeni > 1:
    print("Meethi chai")
else:
    print("Feeki chai")`), output:"Meethi chai",
    practice:["Set <code>cheeni = 0</code> and run it. What prints now?","Add <code>elif cheeni == 1:</code> and print \"Normal chai\"."],
    takeaway:"if-else is how the computer decides." },
  { id:"python-4", title:"Lists: all the flavours in one place", video:"media/python-4.mp4",
    concept:["A <b>list</b> is a box that holds many items together, written inside <code>[ ]</code>.",
      "Counting starts at 0, so the first item is <code>flavours[0]</code>.",
      "<code>append()</code> adds a new item, and <code>len()</code> tells you how many items there are."],
    code:PY(`flavours = ["Masala", "Adrak", "Elaichi"]

print(flavours[0])
print(flavours[2])
flavours.append("Tulsi")
print(len(flavours))`), output:"Masala\nElaichi\n4",
    practice:["Print <code>flavours[1]</code>.","Print <code>flavours[3]</code> before the append. What error do you get, and why?"],
    takeaway:"A list keeps all the flavours in one place." },
  { id:"python-5", title:"for loops: try every flavour", video:"media/python-5.mp4",
    concept:["With <code>for f in flavours:</code>, each item in the list goes into <code>f</code>, one at a time.",
      "The code inside the loop runs once for each item.",
      "Whether there are 4 items or 100, the code stays just as short."],
    code:PY(`flavours = ["Masala", "Adrak", "Elaichi", "Tulsi"]

for f in flavours:
    print(f + " chai")`), output:"Masala chai\nAdrak chai\nElaichi chai\nTulsi chai",
    practice:["Add \"Kesar\" to the list and run the loop again.","Put a number in front of each line (hint: use a <code>count</code> variable)."],
    takeaway:"A for loop handles every item, one by one." },
  { id:"python-6", title:"Dictionaries: the chai menu card", video:"media/python-6.mp4",
    concept:["A <b>dictionary</b> stores pairs of keys and values: an item's name and its price.",
      "Give it a key, get the value back: <code>menu[\"Masala\"]</code> gives 20.",
      "Adding an item and changing a price both use <code>menu[key] = value</code>."],
    code:PY(`menu = {"Masala": 20, "Adrak": 15, "Elaichi": 25}

print(menu["Masala"])
menu["Tulsi"] = 30     # new item
menu["Adrak"] = 18     # price changed
print(menu)`), output:"20\n{'Masala': 20, 'Adrak': 18, 'Elaichi': 25, 'Tulsi': 30}",
    practice:["Build a menu for your own shop with 5 items.","Use <code>for naam in menu:</code> to print each item and its price."],
    takeaway:"A dictionary lets you look things up by name." },
  { id:"python-7", title:"Mini project: the chai bill", video:"media/python-7.mp4",
    concept:["Everything so far, together: the menu is a dictionary and the order is a list.",
      "The <code>bill()</code> function uses a <code>for</code> loop to add up the price of each item.",
      "An <code>if</code> gives a 5 rupee discount on bills over 50."],
    code:PY(`menu = {"Masala": 20, "Adrak": 15}
order = ["Masala", "Adrak", "Masala"]

def bill(order):
    total = 0
    for item in order:
        total += menu[item]
    if total > 50:
        total -= 5
    return total

print("Total:", bill(order))`), output:"Total: 50",
    practice:["Add one more \"Adrak\" to the order. What is the new total?","Change the discount to 10%."],
    takeaway:"You're a Python coder now!" },
  { id:"python-8", title:"input: ask the customer", video:"media/python-8.mp4",
    concept:["<code>input()</code> pauses the program and waits for the user to type an answer.",
      "input always gives you <b>text</b>. If you need a number, wrap it in <code>int()</code>.",
      "Without int, <code>\"3\" * 20</code> writes \"3\" twenty times instead of giving 60."],
    code:PY(`naam = input("Naam? ")
print("Namaste", naam)

cups = int(input("Kitne cup? "))
print("Bill:", cups * 20)`), output:"Naam? Raj\nNamaste Raj\nKitne cup? 3\nBill: 60",
    practice:["Also ask for the flavour and take its price from the menu.","Remove <code>int()</code>, run it, and look at the output."],
    takeaway:"input lets your program talk to people." },
  { id:"python-9", title:"try-except: explain, don't crash", video:"media/python-9.mp4",
    concept:["If the customer types \"teen\" instead of a number, <code>int()</code> raises a <b>ValueError</b> and the program crashes.",
      "Put the risky code inside <code>try</code>. If an error happens, <code>except</code> catches it.",
      "The program keeps running and politely tells the user what went wrong."],
    code:PY(`try:
    cups = int(input("Kitne cup? "))
    print("Bill:", cups * 20)
except ValueError:
    print("Number likho!")`), output:"Kitne cup? teen\nNumber likho!",
    practice:["Put this code inside a <code>while True</code> loop so it keeps asking until it gets a valid number (see Lesson 10)."],
    takeaway:"try-except: explain the problem instead of crashing." },
  { id:"python-10", title:"while True: keep the shop open", video:"media/python-10.mp4",
    concept:["<code>while True</code> means keep going forever: take an order, serve chai, next order.",
      "<code>break</code> exits the loop immediately.",
      "To close the shop, type \"band\". The <code>if</code> and <code>break</code> stop the loop."],
    code:PY(`while True:
    order = input("Order? ")
    if order == "band":
        break
    print(order, "ready!")
print("Dukaan band! Kal milte hain.")`), output:"Order? Masala\nMasala ready!\nOrder? band\nDukaan band! Kal milte hain.",
    practice:["Add every order to a list and print all the orders when the shop closes.","Add the try-except from Lesson 9 and also ask how many cups."],
    takeaway:"while True keeps going; break stops." }
  ]}]
},
{
  id: "chatbot", title: "AI + Python: Build a Chai Chatbot", tag: "50 lessons · Part 1 live",
  cover: "media/chatbot-1.jpg",
  blurb: "Build your own chatbot with Python. Start with a simple rule-based bot and grow it into a Claude-powered bot, a web app and an AI agent.",
  modules: [
  { title: "Season 1 · From simple bot to smart bot", lessons: [
    { id:"chatbot-1", title:"Build a chai chatbot!", video:"media/chatbot-1.mp4",
      concept:["A chatbot is a program that talks with you: you type, it replies.",
        "You only need 3 things, all of which you learned in Python with Chai:",
        "<code>input()</code> = listen · <code>print()</code> = reply · <code>while True</code> = keep going.",
        "Our first Chai Bot is still simple: it says \"Chai ready!\" to everything. The next lessons make it smarter."],
      code:PY(`while True:
    msg = input("Aap: ")
    if msg == "bye": break
    print("Bot: Chai ready!")`), output:"Aap: menu\nBot: Chai ready!\nAap: kaise ho?\nBot: Chai ready!\nAap: bye",
      practice:["Change the bot's reply, for example to \"Bot: Give me 2 minutes!\".","Make the bot say \"Come again!\" after \"bye\"."],
      takeaway:"Chatbot = listen + reply + keep going." },
    { id:"chatbot-2", title:"Teach the bot to reply (if-else)", video:"media/chatbot-2.mp4",
      concept:["In Part 1 the bot said \"Chai ready!\" to everything. Now it gets a brain: <b>if-else</b>.",

// Social profiles: shown in the header, footer, Community and About
const SOCIAL = [
  { name: "YouTube", url: "https://www.youtube.com/@SamjhowithRaj" },

  { name: "Facebook", url: "https://www.facebook.com/profile.php?id=61595088790170&sk=reels_tab" },
];
function fillSocial(){ document.querySelectorAll("[data-social]").forEach(el => {
  el.innerHTML = SOCIAL.map(x => `<a href="${x.url}" target="_blank" rel="noopener">${x.name}</a>`).join(""); }); }
function soon(title){ return { title, locked:true }; }

// ---------- progress (per browser) ----------
const KEY = "swr-done";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} }

const live = c => c.modules.flatMap(m => m.lessons).filter(l => !l.locked);
const total = c => c.modules.reduce((n, m) => n + m.lessons.length, 0);
const pct = c => { const L = live(c); return L.length ? Math.round(100 * L.filter(l => done.has(l.id)).length / L.length) : 0; };
function find(id){ for (const c of COURSES) for (const l of live(c)) if (l.id === id) return [c, l]; return [null, null]; }

// ---------- tiny python highlighter ----------
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(code){
  return code.split("\n").map(line => {
    let out = "", rest = line, m;
    const re = /("[^"]*"|'[^']*'|#.*$)/;
    while ((m = re.exec(rest))) {
      out += kw(esc(rest.slice(0, m.index)));
      out += m[0][0] === "#" ? `<span class="c">${esc(m[0])}</span>` : `<span class="s">${esc(m[0])}</span>`;
      rest = rest.slice(m.index + m[0].length);
    }
    return out + kw(esc(rest));
  }).join("\n");
}
function kw(s){ return s.replace(/\b(def|return|if|elif|else|for|in|while|True|False|break|try|except|print|input|int|len|import)\b/g, '<span class="k">$1</span>'); }

// ---------- views ----------
const app = document.getElementById("app");

function classroom(){
  const lessons = COURSES.reduce((n, c) => n + live(c).length, 0);
  const finished = COURSES.reduce((n, c) => n + live(c).filter(l => done.has(l.id)).length, 0);
  return `
  <div class="page-head">
    <div><div class="eyebrow">Classroom</div>
      <h1>Understand it, learn it, <em>try it yourself.</em></h1>
      <p class="lead">Every lesson has a short video, simple notes, code you can copy and a practice task. No Python background needed.</p>
      <p class="hindi">Videos are in Hinglish with on-screen text. All notes are in English.</p></div>
    <div class="stats"><div><b>${COURSES.length}</b>courses</div><div><b>${lessons}</b>lessons live</div><div><b>${finished}</b>done by you</div></div>
  </div>
  <div class="courses">${COURSES.map(c => `
    <a class="course" href="#${live(c)[0].id}">
      <div class="cover"><img src="${c.cover}" alt="" loading="lazy"><span class="pill">${c.tag}</span></div>
      <div class="cbody"><h3>${c.title}</h3><p>${c.blurb}</p>
        <div class="meta">${live(c).length} of ${total(c)} lessons available</div>
        <div class="progrow"><div class="prog"><i style="width:${pct(c)}%"></i></div>${pct(c)}%</div></div>
    </a>`).join("")}
  </div>
  <p class="note">New lessons arrive every week. See what's coming in <a href="#upcoming">Upcoming</a>.</p>`;
}

function lessonView(c, l){
  const L = live(c), i = L.indexOf(l), prev = L[i - 1], next = L[i + 1];
  const side = `
  <aside class="side">
    <div class="side-head"><a class="back" href="#classroom">← All courses</a><h3>${c.title}</h3>
      <div class="progrow"><div class="prog"><i style="width:${pct(c)}%"></i></div>${pct(c)}%</div></div>
    ${c.modules.map(m => {
      const open = m.lessons.includes(l) || m === c.modules[0];
      return `<details class="module" ${open ? "open" : ""}><summary>${m.title}<span class="count">${m.lessons.filter(x => !x.locked).length}/${m.lessons.length}</span></summary>
      <ul class="lessons">${m.lessons.map(x => x.locked
        ? `<li><span class="lesson-link locked"><span class="tick lock"></span>${x.title}<span class="soon">Soon</span></span></li>`
        : `<li><a class="lesson-link" href="#${x.id}" ${x === l ? 'aria-current="true"' : ""}><span class="tick ${done.has(x.id) ? "done" : ""}"></span>${x.title}</a></li>`).join("")}</ul></details>`;
    }).join("")}
  </aside>`;
  const body = `
  <article class="lesson">
    <div class="lesson-top"><div class="eyebrow">${c.title} · Lesson ${i + 1}</div><h2>${l.title}</h2></div>
    <div class="player ${c.wide ? "wide" : ""}">${l.video
      ? `<video controls playsinline preload="metadata" poster="${l.video.replace(".mp4", ".jpg")}" src="${l.video}"></video>`
      : `<div class="placeholder"><div><b>Video coming soon</b>Until then, read the notes and run the code.</div></div>`}</div>
    <section class="block"><h3>The idea</h3>${l.concept.map(p => `<p>${p}</p>`).join("")}${l.list ? `<ul>${l.list.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}</section>
    ${l.code ? `<section class="codebox"><div class="file"><span>chai.py</span><button class="copy" type="button" data-code="${encodeURIComponent(l.code)}">Copy</button></div>
      <pre><code>${hl(l.code)}</code></pre>
      ${l.output ? `<div class="out"><div class="file"><span>Output</span></div><pre>${esc(l.output)}</pre></div>` : ""}</section>` : ""}
    <section class="block try"><h3>Try it yourself</h3><ul>${l.practice.map(p => `<li>${p}</li>`).join("")}</ul></section>
    <section class="block takeaway"><h3>Remember</h3><p>${l.takeaway}</p></section>
    <div class="lesson-actions">
      <button class="btn ${done.has(l.id) ? "done" : "primary"}" type="button" id="mark" data-id="${l.id}">${done.has(l.id) ? "✓ Completed" : "Mark as complete"}</button>
      <div class="navbtns">
        <a class="btn" href="${prev ? "#" + prev.id : "#classroom"}" ${prev ? "" : 'aria-disabled="true"'}>← Previous</a>
        <a class="btn" href="${next ? "#" + next.id : "#upcoming"}">${next ? "Next →" : "What's next →"}</a>
      </div>
    </div>
  </article>`;
  return `<div class="course-view">${side}${body}</div>`;
}

function upcoming(){
  const items = [];
  for (const c of COURSES) {
    const next = c.modules.flatMap(m => m.lessons).filter(l => l.locked).slice(0, 4);
    next.forEach((l, k) => items.push({ c, l, first: k === 0 }));
  }
  return `<div class="page-head"><div><div class="eyebrow">Upcoming</div><h2>Next lessons</h2>
    <p class="lead">The next lessons for each course, in the order they will be released. Each lesson opens in the Classroom as soon as its video is out.</p></div></div>
  <ol class="timeline">${items.map(x => `<li><span class="course-tag">${x.c.title}</span><span>${x.l.title}</span><span class="chip ${x.first ? "next" : ""}">${x.first ? "Next" : "Planned"}</span></li>`).join("")}</ol>`;
}

function community(){
  return `<div class="page-head"><div><div class="eyebrow">Community</div><h2>Learn together</h2>
    <p class="lead">Have a question, an error in your code, or an idea for the next topic? Get in touch below. Every question helps make the next videos better.</p></div></div>
  <div class="panel">
    <div class="card"><h3>Ask a question</h3><p>Send the lesson name and your code. You'll get an answer by email or in a future video.</p><span class="mail">samjhowithraj@gmail.com</span></div>
    <div class="card"><h3>Comment on the videos</h3><p>Watch every lesson as a short video and share your output in the comments.</p><div class="social" data-social style="margin-top:12px"></div></div>
    <div class="card"><h3>Show your project</h3><p>Built your own chai bill or Chai Bot? Send a screenshot. The best projects will be featured in a video.</p></div>
  </div>`;
}

function about(){
  return `<div class="about"><img src="img/raj-mark.png" alt="Samjho with Raj logo">
  <div><div class="eyebrow">About</div><h2>Hi, I'm Raj.</h2>
    <p>I work in technology architecture, with experience in Python, Azure and data platforms. This is where I turn complicated ideas into simple, useful lessons.</p>
    <p>The approach is simple: explain the idea, try it on a real task, and show what worked and what needs checking. You don't need a technical background.</p>
    <div class="principles"><span>Explain clearly</span><span>Show the evidence</span><span>Learn by doing</span></div>
    <div class="social" data-social style="margin-top:20px"></div>
    <p style="margin-top:24px">Want to talk about a collaboration or a course? <span class="mail">samjhowithraj@gmail.com</span></p>
  </div></div>`;
}

function render(){
  const h = (location.hash || "#classroom").slice(1);
  const [c, l] = find(h);
  let tab = "classroom";
  if (c) app.innerHTML = lessonView(c, l);
  else if (h === "upcoming") { app.innerHTML = upcoming(); tab = h; }
  else if (h === "community") { app.innerHTML = community(); tab = h; }
  else if (h === "about") { app.innerHTML = about(); tab = h; }
  else app.innerHTML = classroom();
  document.querySelectorAll(".tab").forEach(t => t.dataset.tab === tab ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
  fillSocial();
  document.title = c ? `${l.title} · Samjho with Raj` : "Samjho with Raj Classroom";
}

app.addEventListener("click", e => {
  const copy = e.target.closest(".copy");
  if (copy) {
    const text = decodeURIComponent(copy.dataset.code);
    const ok = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(copy.closest(".codebox").querySelector("pre")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copy.textContent = "Selected, press Ctrl+C"; };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (err) { fallback(); }
  }
  const mark = e.target.closest("#mark");
  if (mark) { const id = mark.dataset.id; done.has(id) ? done.delete(id) : done.add(id); save(); const y = scrollY; render(); scrollTo(0, y); }
});
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
render();
</script>
