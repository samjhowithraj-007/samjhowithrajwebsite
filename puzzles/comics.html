<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dada Comics · Dada World</title>
<meta name="description" content="Dada Comics: read Dimaag Dada's puzzle comics with Anna and Chiklu. Solve each clue to turn the page. Works offline.">
<meta name="theme-color" content="#0f181b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<style>
:root{--bg:#0f181b;--card:#192a2f;--line:#2a3f44;--ink:#f7f3ea;--muted:#9fb4b6;--cyan:#19e6e6;--pink:#ea4cf7;--amber:#ffb904;--ok:#3ddc84;--bad:#ff5a5f;
--disp:"Trebuchet MS","Avenir Next",system-ui,sans-serif;--comic:"Comic Sans MS","Chalkboard SE","Comic Neue",var(--disp);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#3a2a18 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 32px;overflow-x:clip}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top a,.top button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;min-height:40px;display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:13px}
h1{font:800 22px/1 var(--disp);margin:0;flex:1}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0}
.ep img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#2a3f44}
.ep div{padding:8px 10px}.ep b{display:block;font:800 15px/1.2 var(--disp)}.ep small{color:var(--muted)}
.ep.soon{opacity:.55}
.badge{display:inline-block;background:var(--ok);color:#062022;font:800 10px/1 system-ui;padding:4px 7px;border-radius:999px;margin-top:6px}
.badge.s{background:#3a4c50;color:#e8f0f0}
.page{position:relative;border-radius:16px;overflow:hidden;border:4px solid #111;background:#fff;box-shadow:0 8px 24px #0009}
.page .art{position:relative}.page img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#ddd}
.cap{position:absolute;left:8px;top:8px;max-width:72%;background:#ffe9a8;color:#2a1d05;border:2px solid #111;padding:6px 9px;font:700 14px/1.3 var(--comic);box-shadow:3px 3px 0 #111}
.talk{background:#fff;border-top:4px solid #111;padding:14px 10px 10px;display:flex;flex-direction:column;gap:12px}
.bub{position:relative;max-width:86%;align-self:flex-start;background:#fff;color:#111;border:2.5px solid #111;border-radius:18px;padding:7px 11px;font:700 15px/1.3 var(--comic);box-shadow:2px 3px 0 #0004}
.bub::after{content:"";position:absolute;top:-9px;width:14px;height:14px;background:#fff;border-left:2.5px solid #111;border-top:2.5px solid #111;transform:rotate(45deg)}
.bub.l::after{left:26px}.bub.r{align-self:flex-end}.bub.r::after{right:26px}
.bub b{display:block;font-size:11px;color:#7a5cff;letter-spacing:.04em}
.nav{display:flex;align-items:center;gap:10px;margin-top:12px}
.nav button{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--card);border:1px solid var(--line)}
.nav .nx{flex:1;background:var(--cyan);color:#062022;border:0}
.nav .nx:disabled{opacity:.4}
.dots{display:flex;gap:5px;justify-content:center;margin-top:10px}.dots i{width:8px;height:8px;border-radius:50%;background:#3a4c50}.dots i.on{background:var(--amber)}
.clue{margin-top:12px;background:var(--card);border:2px dashed var(--amber);border-radius:16px;padding:14px}
.clue h3{margin:0 0 4px;font:800 16px/1.2 var(--disp);color:var(--amber)}
.clue p{margin:0 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:#0f181b;border-radius:12px;padding:12px 6px;font:800 18px/1.1 var(--disp);min-height:52px}
.opts button.ok{background:var(--ok);color:#062022}.opts button.no{background:var(--bad)}
.fb{min-height:22px;margin-top:8px;font-weight:700}
.end{text-align:center}.end img{width:84px;border-radius:50%;border:3px solid var(--amber)}
@media (prefers-reduced-motion:no-preference){.page{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateX(18px)}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./" id="back">← Play</a><h1 id="ttl">Dada Comics</h1></div>
  <div id="view"></div>
</div>
<script>
// Each page: art image (no text in the art), caption box, speech bubbles placed in % of the page, optional clue gate.
const EPS = [{
  id: "trail-1", t: "The Puzzle Trail", n: "Episode 1", cover: "img/comic/trail-1-cover.webp", free: true,
  pages: [
    { img: "img/comic/trail-1-p1.webp", cap: "A rainy Sunday at Dada's house…",
      bub: [{ who: "ANNA", t: "Chiklu, look! An old map in Dada's trunk!", x: 5, y: 70, s: "l" }, { who: "CHIKLU", t: "It has a big X on it… treasure?!", x: 36, y: 80, s: "r" }] },
    { img: "img/comic/trail-1-p2.webp", cap: "They run downstairs to show Dada.",
      bub: [{ who: "DADA", t: "That's my old Puzzle Trail! Solve every clue, and the treasure is yours.", x: 5, y: 76, s: "l" }] },
    { img: "img/comic/trail-1-p3.webp", cap: "Stop 1: the old garden gate has a puzzle lock.",
      bub: [{ who: "CHIKLU", t: "The note on the lock says: 2, 4, 8, 16, … what comes next?", s: "l" }],
      clue: { q: "Clue 1, the gate lock: 2, 4, 8, 16, ?", o: ["18", "24", "32", "20"], a: "32", why: "Each number doubles: 16 × 2 = 32. Click! The gate opens." } },
    { img: "img/comic/trail-1-p4.webp", cap: "Stop 2: three flower pots in the garden.",
      bub: [{ who: "ANNA", t: "The key is under the pot that is NOT red and NOT the biggest.", x: 5, y: 78, s: "l" }],
      clue: { q: "Pots: a big blue pot, a small red pot, a small yellow pot. Which one hides the key?", o: ["Big blue", "Small red", "Small yellow", "None"], a: "Small yellow", why: "Not red rules out the red pot, and not the biggest rules out the blue one. A shiny key!" } },
    { img: "img/comic/trail-1-p5.webp", cap: "Stop 3: the stepping stones across the stream.",
      bub: [{ who: "DADA", t: "Only step on the ODD numbers, Chiklu!", x: 5, y: 78, s: "l" }],
      clue: { q: "The stones say 12, 7, 20, 15, 9. How many stones can Chiklu step on?", o: ["2", "3", "4", "6"], a: "3", why: "7, 15 and 9 are odd, so 3 stones. Chiklu crosses safely!" } },
    { img: "img/comic/trail-1-p6.webp", cap: "Last stop: a box in the roots of the old banyan tree, with a word lock.",
      bub: [{ who: "ANNA", t: "The box is locked! There's a riddle on it.", s: "l" }],
      after: [{ who: "CHIKLU", t: "Puzzle books! And a gold medal for each of us!", s: "l" }, { who: "DADA", t: "The real treasure is a sharp mind. Shabash, champions!", s: "r" }],
      clue: { q: "The lock riddle: \"I have hands but I never clap.\" What am I?", o: ["CLOCK", "GLOVE", "TREE", "ROBOT"], a: "CLOCK", why: "A clock has hands that never clap! The box pops open." } }
  ]
}, { id: "trail-2", t: "The Secret Train", n: "Episode 2", cover: "img/train-journey-sm.webp", soon: true }];

const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let ep = null, pg = 0, solved = {};

function shelf() {
  ep = null; $("ttl").textContent = "Dada Comics"; $("back").textContent = "← Play"; $("back").href = "./"; $("back").onclick = null;
  $("view").innerHTML = `<p style="margin-top:0;color:var(--muted)">Read Dada's puzzle comics. Solve each clue to turn the page!</p><div class="shelf">${EPS.map((e, i) => `<button type="button" class="ep${e.soon ? " soon" : ""}" data-i="${i}" ${e.soon ? "disabled" : ""}><img src="${e.cover}" alt="" loading="lazy"><div><b>${e.t}</b><small>${e.n}</small><br><span class="badge${e.soon ? " s" : ""}">${e.soon ? "COMING SOON" : "FREE"}</span></div></button>`).join("")}</div>`;
  $("view").querySelectorAll(".ep:not(.soon)").forEach(b => b.onclick = () => open(+b.dataset.i));
}
function open(i) {
  ep = EPS[i]; solved = JSON.parse(store.get("cx-" + ep.id) || "{}"); pg = 0;
  $("ttl").textContent = ep.t; $("back").textContent = "← Comics"; $("back").href = "#"; $("back").onclick = e => { e.preventDefault(); shelf(); };
  page();
}
function page() {
  if (pg >= ep.pages.length) return done();
  const p = ep.pages[pg], gate = p.clue && !solved[pg];
  const bubs = (gate ? p.bub : (p.after || p.bub)) || [];
  $("view").innerHTML = `<div class="page"><div class="art"><img src="${p.img}" alt="Comic page ${pg + 1}">${p.cap ? `<div class="cap">${p.cap}</div>` : ""}</div><div class="talk" id="talk">${bubs.map(b => `<div class="bub ${b.s}"><b>${b.who}</b>${b.t}</div>`).join("")}</div></div>
  ${p.clue ? `<div class="clue"><h3>🧩 Dada's clue</h3><p>${p.clue.q}</p><div class="opts">${p.clue.o.map(o => `<button type="button" data-v="${o}"${solved[pg] ? ` disabled${o === p.clue.a ? ' class="ok"' : ""}` : ""}>${o}</button>`).join("")}</div><div class="fb" id="fb">${solved[pg] ? "✅ " + p.clue.why : ""}</div></div>` : ""}
  <div class="nav"><button type="button" id="pv" ${pg ? "" : "disabled"}>◀</button><button type="button" class="nx" id="nx" ${gate ? "disabled" : ""}>${pg === ep.pages.length - 1 ? "Finish ★" : gate ? "Solve the clue to turn" : "Next page ▶"}</button></div>
  <div class="dots">${ep.pages.map((_, j) => `<i class="${j === pg ? "on" : ""}"></i>`).join("")}</div>`;
  $("pv").onclick = () => { pg--; page(); scrollTo(0, 0); };
  $("nx").onclick = () => { pg++; page(); scrollTo(0, 0); };
  if (p.clue) $("view").querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    if (b.dataset.v === p.clue.a) {
      b.classList.add("ok"); solved[pg] = 1; store.set("cx-" + ep.id, JSON.stringify(solved));
      $("fb").textContent = "✅ " + p.clue.why; $("nx").disabled = false; $("nx").textContent = pg === ep.pages.length - 1 ? "Finish ★" : "Next page ▶";
      $("view").querySelectorAll(".opts button").forEach(x => x.disabled = true);
      if (p.after) $("talk").innerHTML = p.after.map(b => `<div class="bub ${b.s}"><b>${b.who}</b>${b.t}</div>`).join("");
    } else { b.classList.add("no"); b.disabled = true; $("fb").textContent = "Not quite. Dada says: think again!"; }
  });
}
function done() {
  const n = Object.keys(solved).length, tot = ep.pages.filter(p => p.clue).length;
  $("view").innerHTML = `<div class="card end clue" style="border-style:solid"><img src="img/dada.webp" alt="Dada"><h3 style="font-size:22px;margin-top:8px">The End!</h3><p>You solved ${n} of ${tot} clues on the Puzzle Trail. 🏅</p><p style="color:var(--muted)">Episode 2, <b>The Secret Train</b>, is coming soon.</p><div class="nav"><button type="button" id="again">Read again</button><button type="button" class="nx" id="sh">More comics</button></div></div>`;
  $("again").onclick = () => { pg = 0; page(); }; $("sh").onclick = shelf;
}
shelf();
</script>
</body>
</html>
