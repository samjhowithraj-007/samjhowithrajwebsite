<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snakes &amp; Sums · Dada World</title>
<meta name="description" content="Snakes &amp; Sums by Dimaag Dada: answer a sum to climb a ladder or escape a snake. 1 to 4 players, works offline.">
<meta name="theme-color" content="#0f181b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<style>
:root{--bg:#0f181b;--card:#192a2f;--line:#2a3f44;--ink:#f7f3ea;--muted:#9fb4b6;--cyan:#19e6e6;--amber:#ffb904;--ok:#3ddc84;--bad:#ff5a5f;
--disp:"Trebuchet MS","Avenir Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 500px at 10% -10%,#183a3f 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 32px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top a{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;text-decoration:none;font-weight:700;font-size:13px}
h1{font:800 22px/1 var(--disp);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.setup label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.setup select{background:#0f181b;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:-2px}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:13px;background:var(--cyan);color:#062022;font-weight:800;font-size:17px}
.board{position:relative;width:100%;aspect-ratio:1;background:#3f8f4f url(img/snakes-board.webp) center/cover;border-radius:14px;overflow:hidden;border:3px solid #2a3f44}
.bgrid{position:absolute;inset:10%;display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr);border-radius:6px;box-shadow:0 0 0 2px #2f6d3a}
.sq{display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 3px;font:700 clamp(8px,2.2vw,12px)/1 var(--disp);color:#4a3f2c}
.sq{background:#fdf6e3;box-shadow:inset 1px 1px 0 #fff9,inset -1px -1px 0 #0001}.sq.alt{background:#c9efd9}
.sq.win{background:var(--amber)!important}
.nums{position:absolute;inset:0;display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr);pointer-events:none}
.nums span{padding:2px 3px;font:800 clamp(8px,2.3vw,12px)/1 var(--disp);color:#3a2f1c;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9}
.tok{position:absolute;width:6.8%;aspect-ratio:1;border-radius:50%;border:1.5px solid #fff;background-image:radial-gradient(circle at 32% 28%,#fffc 0,#fff6 14%,#0000 38%),radial-gradient(circle at 60% 75%,#0000 40%,#0006 100%)!important;box-shadow:0 3px 5px #0008,inset 0 -2px 3px #0005;transform:translate(-50%,-50%);transition:left .16s,top .16s;z-index:2}
.bar{display:flex;align-items:center;gap:12px;margin-top:12px}
.die{width:64px;height:64px;border-radius:14px;border:0;background:#fff;color:#111;font:800 34px/1 var(--disp);box-shadow:0 4px 0 #0005}
.die:disabled{opacity:.55}
.msg{flex:1;font-weight:700}
.msg small{display:block;color:var(--muted);font-weight:500}
.quiz{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}
.quiz[hidden]{display:none}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(380px,100%);text-align:center}
.qbox img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--amber)}
.qbox .q{font:800 34px/1.1 var(--disp);margin:10px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:1px solid var(--line);background:#0f181b;border-radius:14px;padding:14px 0;font:800 24px/1 var(--disp);min-height:56px}
.opts button.ok{background:var(--ok);color:#062022}.opts button.no{background:var(--bad)}
.rules{margin-top:14px;color:var(--muted);font-size:14px}.rules b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./">← Play</a><h1>Snakes &amp; Sums</h1></div>
  <div id="setup" class="card setup">
    <p style="margin-top:0">Land on a ladder? Answer Dada's sum to climb. Land on a snake? Answer it right to escape!</p>
    <label><span>Maths level</span><select id="lvl"><option value="1">Easy: + and − up to 20</option><option value="2" selected>Medium: tables up to 10</option><option value="3">Hard: mixed up to 100</option></select></label>
    <div id="seats"></div>
    <button class="go" id="start" type="button">Start game</button>
  </div>
  <div id="game" hidden>
    <div class="board" id="board"></div>
    <div class="bar"><button class="die" id="die" type="button" aria-label="Roll the dice">🎲</button><div class="msg" id="msg"></div></div>
    <div class="rules"><b>Rules:</b> Roll and move. On a <b>ladder</b>, a right answer takes you up. On a <b>snake</b>, a right answer keeps you safe, a wrong one slides you down. You need the exact roll to land on 100.</div>
  </div>
</div>
<div class="quiz" id="quiz" hidden><div class="qbox" role="dialog" aria-live="polite"><img src="img/dada.webp" alt="Dada"><div id="qt" style="font-weight:700"></div><div class="q" id="qq"></div><div class="opts" id="qo"></div></div></div>
<script>
const COL = [{n:"Red",c:"#ff5a5f"},{n:"Green",c:"#3ddc84"},{n:"Blue",c:"#3aa0ff"},{n:"Purple",c:"#b06cff"}];
const BOTS = ["Dada", "Anna", "Chiklu", "Botu"];
const LAD = {4:14, 9:31, 21:42, 28:84, 36:44, 51:67, 71:91, 80:99};
const SNK = {17:7, 47:26, 54:34, 62:19, 64:60, 87:24, 93:73, 95:75, 98:79};
const $ = id => document.getElementById(id);
let players = [], turn = 0, busy = false, LV = 2;

$("seats").innerHTML = COL.map((c, i) => `<label><span><span class="dot" style="background:${c.c}"></span>${c.n}</span><select id="s${i}"><option value="h">Player</option><option value="bot">${BOTS[i]} (computer)</option><option value="off">Not playing</option></select></label>`).join("");
["h", "bot", "off", "off"].forEach((v, i) => $("s" + i).value = v);
$("start").onclick = () => {
  LV = +$("lvl").value;
  players = COL.map((c, i) => ({ ...c, i, who: $("s" + i).value, bot: BOTS[i], at: 0 })).filter(p => p.who !== "off");
  if (!players.length) { alert("Pick at least 1 player."); return; }
  $("setup").hidden = true; $("game").hidden = false; drawBoard(); next(0);
};
// square n (1..100) -> [col,row] with row 0 at top
const rc = n => { const r = Math.floor((n - 1) / 10), c = (n - 1) % 10; return [r % 2 ? 9 - c : c, 9 - r]; };
const ctr = n => { const [c, r] = rc(n); return [c * 10 + 5, r * 10 + 5]; };
function drawBoard() {
  let h = "", nums = "";
  for (let r = 0; r < 10; r++) for (let c = 0; c < 10; c++) { const row = 9 - r, n = row * 10 + (row % 2 ? 9 - c : c) + 1; h += `<div class="sq${(r + c) % 2 ? " alt" : ""}${n === 100 ? " win" : ""}"></div>`; nums += `<span>${n === 100 ? "🏆" : n}</span>`; }
  let s = '<svg class="ov" viewBox="0 0 100 100" aria-hidden="true"><defs>' +
    '<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx=".5" dy=".9" stdDeviation=".6" flood-color="#000" flood-opacity=".45"/></filter>' +
    '<linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#5a3412"/><stop offset=".45" stop-color="#d9934a"/><stop offset=".6" stop-color="#f3c27d"/><stop offset="1" stop-color="#6b3d15"/></linearGradient>' +
    '<radialGradient id="eye" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe6ea"/></radialGradient></defs>';
  for (const [a, b] of Object.entries(LAD)) {
    const [x1, y1] = ctr(+a), [x2, y2] = ctr(b), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), px = -dy / L * 1.9, py = dx / L * 1.9;
    let g = `<g filter="url(#sh)" stroke-linecap="round">`;
    for (let t = .08; t < .97; t += 3.4 / L) g += `<line x1="${x1 + dx * t + px}" y1="${y1 + dy * t + py}" x2="${x1 + dx * t - px}" y2="${y1 + dy * t - py}" stroke="#7a4518" stroke-width="1.1"/><line x1="${x1 + dx * t + px * .9}" y1="${y1 + dy * t + py * .9 - .25}" x2="${x1 + dx * t - px * .9}" y2="${y1 + dy * t - py * .9 - .25}" stroke="#f0bd78" stroke-width=".35"/>`;
    for (const k of [1, -1]) g += `<line x1="${x1 + px * k}" y1="${y1 + py * k}" x2="${x2 + px * k}" y2="${y2 + py * k}" stroke="#4a2a0e" stroke-width="1.5"/><line x1="${x1 + px * k}" y1="${y1 + py * k}" x2="${x2 + px * k}" y2="${y2 + py * k}" stroke="#d48b45" stroke-width="1"/><line x1="${x1 + px * k - .2}" y1="${y1 + py * k - .2}" x2="${x2 + px * k - .2}" y2="${y2 + py * k - .2}" stroke="#ffd9a0" stroke-width=".3" opacity=".9"/>`;
    s += g + "</g>";
  }
  const SC = [["#1e8a4c", "#3fd17a", "#b8ffcf", "#0f5a30"], ["#b0245a", "#ff5c95", "#ffd0e1", "#6e0f35"], ["#5a3cc9", "#9b7bff", "#e2d8ff", "#33207f"], ["#c45f0e", "#ffa043", "#ffe2bf", "#7a3a05"]]; let k = 0;
  for (const [a, b] of Object.entries(SNK)) {
    const [x1, y1] = ctr(+a), [x2, y2] = ctr(b), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L, w = Math.min(6, L / 5);
    const [dk, md, hi, sp] = SC[k++ % 4];
    const P = (t, o) => [x1 + dx * t + nx * o, y1 + dy * t + ny * o];
    const [ax, ay] = P(.25, w), [bx, by] = P(.5, 0), [cx, cy] = P(.75, -w);
    const d = `M${x1} ${y1} Q${ax} ${ay} ${bx} ${by} Q${cx} ${cy} ${x2} ${y2}`;
    s += `<g filter="url(#sh)" stroke-linecap="round" fill="none">` +
      `<path d="${d}" stroke="${dk}" stroke-width="3.4"/>` +
      `<path d="${d}" stroke="${md}" stroke-width="2.6"/>` +
      `<path d="${d}" stroke="${sp}" stroke-width="1.6" stroke-dasharray=".9 2.4" opacity=".55"/>` +
      `<path d="${d}" stroke="${hi}" stroke-width=".7" opacity=".75" transform="translate(-.45 -.45)"/></g>`;
    const ang = Math.atan2(y1 - ay, x1 - ax) * 180 / Math.PI;
    s += `<g transform="translate(${x1} ${y1}) rotate(${ang})" filter="url(#sh)">` +
      `<path d="M2.6 0 l1.6 -.5 M2.6 0 l1.6 .5 M2.6 0 h1" stroke="#e0203a" stroke-width=".35" stroke-linecap="round"/>` +
      `<ellipse rx="3" ry="2.4" fill="${dk}"/><ellipse rx="2.7" ry="2.1" fill="${md}"/><ellipse cx="-.5" cy="-.7" rx="1.4" ry=".7" fill="${hi}" opacity=".7"/>` +
      `<circle cx=".9" cy="-1.1" r=".75" fill="url(#eye)"/><circle cx=".9" cy="1.1" r=".75" fill="url(#eye)"/><circle cx="1.15" cy="-1.1" r=".38" fill="#111"/><circle cx="1.15" cy="1.1" r=".38" fill="#111"/>` +
      `<circle cx="1.25" cy="-1.25" r=".12" fill="#fff"/><circle cx="1.25" cy=".95" r=".12" fill="#fff"/></g>`;
    s += `<circle cx="${x2}" cy="${y2}" r=".9" fill="${md}" stroke="${dk}" stroke-width=".3"/>`;
  }
  $("board").innerHTML = '<div class="bgrid">' + h + s + '</svg><div class="nums">' + nums + '</div><div id="toks"></div></div>';
}
function draw() {
  $("toks").innerHTML = players.map((p, j) => {
    const [x, y] = p.at ? ctr(p.at) : [-3 + 0, 103], same = players.filter(q => q.at === p.at), m = same.indexOf(p), sh = same.length > 1 ? (m - (same.length - 1) / 2) * 2.4 : 0;
    const left = p.at ? x + sh : 5 + j * 7, top = p.at ? y + sh : 105;
    return `<div class="tok" title="${name(p)}" style="background-color:${p.c};left:${left}%;top:${top}%"></div>`;
  }).join("");
}
const name = p => p.who === "bot" ? p.bot : p.n;
const say = (a, b = "") => $("msg").innerHTML = a + (b ? `<small>${b}</small>` : "");
const wait = ms => new Promise(r => setTimeout(r, ms));
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function makeSum() {
  let q, a;
  const t = LV === 3 ? (Math.random() < .7 ? 3 : R(1, 2)) : LV;
  if (t === 1) { if (Math.random() < .5) { const x = R(2, 12), y = R(1, 8); q = `${x} + ${y}`; a = x + y; } else { const x = R(8, 20), y = R(1, x - 1); q = `${x} − ${y}`; a = x - y; } }
  else if (t === 2) { const x = R(2, 10), y = R(2, 10); q = `${x} × ${y}`; a = x * y; }
  else { if (Math.random() < .5) { const x = R(11, 60), y = R(5, 39); q = `${x} + ${y}`; a = x + y; } else { const y = R(2, 9), a2 = R(2, 11); q = `${y * a2} ÷ ${y}`; a = a2; } }
  const opts = new Set([a]); while (opts.size < 4) { const w = a + R(-5, 5) * (a > 20 ? R(1, 2) : 1); if (w >= 0 && w !== a) opts.add(w); }
  return { q, a, opts: [...opts].sort(() => Math.random() - .5) };
}
function ask(p, title) {
  return new Promise(res => {
    const s = makeSum(); $("qt").textContent = title; $("qq").textContent = s.q + " = ?";
    $("qo").innerHTML = s.opts.map(o => `<button type="button" data-v="${o}">${o}</button>`).join("");
    $("quiz").hidden = false;
    const finish = v => { $("qo").querySelectorAll("button").forEach(b => { b.disabled = true; if (+b.dataset.v === s.a) b.classList.add("ok"); else if (+b.dataset.v === v) b.classList.add("no"); }); setTimeout(() => { $("quiz").hidden = true; res(v === s.a); }, 1100); };
    if (p.who === "bot") setTimeout(() => finish(Math.random() < .8 ? s.a : s.opts.find(o => o !== s.a)), 1200);
    else $("qo").querySelectorAll("button").forEach(b => b.onclick = () => finish(+b.dataset.v));
  });
}
function next(t) {
  turn = t; const p = players[turn];
  $("die").textContent = "🎲"; $("die").style.background = p.c; draw();
  if (p.who === "bot") { $("die").disabled = true; say(`${name(p)} is rolling…`); setTimeout(play, 700); }
  else { $("die").disabled = false; say(`${name(p)}'s turn`, "Tap the dice"); }
}
$("die").onclick = () => { if (!busy) play(); };
async function play() {
  busy = true; $("die").disabled = true; const p = players[turn], d = R(1, 6);
  $("die").textContent = "⚀⚁⚂⚃⚄⚅"[d - 1];
  if (p.at + d > 100) { say(`${name(p)} rolled ${d}`, "Need the exact roll for 100."); await wait(1000); return end(d); }
  say(`${name(p)} rolled ${d}`);
  for (let i = 0; i < d; i++) { p.at++; draw(); await wait(170); }
  if (LAD[p.at]) {
    if (await ask(p, `Ladder! ${name(p)}, answer to climb:`)) { p.at = LAD[p.at]; say("Right answer!", `Up the ladder to ${p.at}`); }
    else say("Oops!", "No climb this time");
  } else if (SNK[p.at]) {
    if (await ask(p, `Snake! ${name(p)}, answer to escape:`)) say("Right answer!", "Safe from the snake");
    else { p.at = SNK[p.at]; say("Sssss!", `Slid down to ${p.at}`); }
  }
  draw(); await wait(700);
  if (p.at === 100) { say(`🏆 ${name(p)} wins!`, "Dada says: shabash, maths champion!"); $("die").disabled = false; $("die").textContent = "↻"; $("die").onclick = () => location.reload(); return; }
  end(d);
}
function end(d) { busy = false; next(d === 6 ? turn : (turn + 1) % players.length); if (d === 6 && players[turn].who !== "bot") say(`${name(players[turn])} rolled a 6`, "Roll again!"); }
</script>
</body>
</html>
