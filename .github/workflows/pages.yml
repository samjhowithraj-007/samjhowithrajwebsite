# Publishes this site to GitHub Pages (www.techsamjhoraj.com) on every push to main. README and archive changes skip it.
name: Publish website
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "IMPROVEMENTS.md", "archive/**", "tools/**"]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue runs; cancelling a running Pages deploy can leave it half-finished

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh tech news (daily; keeps the committed news.json if feeds fail)
        continue-on-error: true
        run: node tools/fetch-news.mjs
      - name: Collect site files
        run: mkdir site && cp -r naukri-saathi index.html favicon.ico CNAME manifest.webmanifest sw.js redesign.css rdlight.css rdhome.css rdhome.js rdbar.js rdtools.js rdlearn.js rdauth.js rdplayer.js rdnews.js rdbooks.js cart.js rdbooks.css reviews.json news.json news-take.json news-videos.json robots.txt sitemap.xml site-index.json googleef50f6b23d7dfe9f.html img media notes puzzles learn python chatbot agentic-ai python-book reasoning-puzzles hi hinglish site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Let the new artifact register
        run: sleep 15
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before one retry
        if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
